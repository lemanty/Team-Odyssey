<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey · Coupons</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"><link rel="stylesheet" th:href="@{/css/coupons.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=full-product-3)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=full-product-3)}"><script defer th:src="@{/js/operations-design.js(v=1)}"></script></head><body class="chosen-design ops-design ops-coupons"><header th:replace="~{fragments/layout :: header('account')}"></header><div class="customer-shell"><aside th:replace="~{fragments/customer-sidebar :: sidebar('coupons')}"></aside><main class="fulfillment-page"><p class="eyebrow">ODYSSEY · OFFERS</p><div class="fulfillment-heading"><h1 th:text="${zh?'优惠券与活动':'Coupons & offers'}"></h1><a th:href="@{/checkout}" th:text="${zh?'去结算选券 →':'Choose at checkout →'}"></a></div><p th:text="${zh?'每单限用一张，每个账号每张券限用一次。结算时检查金额门槛与有效期。取消待备货订单后返还使用资格；售后退款不返券。':'One coupon per order and one use per account. Eligibility is checked at checkout. Cancelling a pending order restores eligibility; returns do not.'}"></p><p th:text="${(zh?'活动时间以 ':'Offer times use ')+couponTimezone}"></p><p class="order-card" th:if="${#lists.isEmpty(offers)}" th:text="${zh?'暂时没有进行中的优惠活动。':'No active offers at the moment.'}"></p><nav class="offer-tabs" data-offer-tabs hidden><button type="button" data-offer-filter="all" th:text="${zh?'全部活动':'All offers'}"></button><button type="button" data-offer-filter="unused" th:text="${zh?'未使用':'Unused'}"></button><button type="button" data-offer-filter="used" th:text="${zh?'已使用':'Used'}"></button></nav><p data-offer-empty hidden th:text="${zh?'此分类暂无活动。':'No offers in this category.'}"></p><div class="offer-grid"><article class="order-card" th:each="offer:${offers}" th:with="c=${offer.coupon}" th:attr="data-offer-state=${#strings.startsWith(offer.unavailable,'Already used')?'used':'unused'}"><div class="coupon-ticket"><div class="coupon-value" th:text="${c.kind=='FIXED'?'−€'+#numbers.formatDecimal(c.value,1,2):c.value+'% OFF'}"></div><div><h2 th:text="${c.title}"></h2><code th:text="${c.code}"></code><p th:text="${(zh?'商品原价合计满 €':'Minimum original subtotal €')+#numbers.formatDecimal(c.minimum,1,2)}"></p><p th:text="${c.stack?(zh?'可叠加会员优惠：先会员折扣，再减券。':'Stackable: membership discount first, then coupon.'):(zh?'不叠加会员优惠：使用此券时仅享优惠券折扣。':'Not stackable: only the coupon discount applies.')}"></p><small th:text="${#temporals.format(c.starts,'yyyy-MM-dd HH:mm')+' → '+#temporals.format(c.ends,'yyyy-MM-dd HH:mm')}"></small></div></div><p class="order-badge" th:text="${offer.unavailable==''?(zh?'结算时可选，需满足金额门槛':'Select at checkout when minimum is met'):storeText.text(offer.unavailable,zh)}"></p></article></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
