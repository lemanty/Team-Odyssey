<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=1)}"><script defer th:src="@{/js/selected-design.js(v=1)}"></script></head><body th:class="${!staffView ? 'chosen-design chosen-returns' : ''}"><header th:replace="~{fragments/layout :: header('orders')}"></header><th:block th:if="${staffView}"><div th:class="${(isAdmin or supportStaff) and staffView?'admin-shell':null}"><th:block th:if="${staffView}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('returns')} "></aside></th:block><main class="order-page fulfillment-page"><p class="cart-feedback cart-error" role="alert" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}"></p><p class="cart-feedback" role="status" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}"></p><div class="fulfillment-heading"><h1 th:text="${staffView?(zh?'售后工作台':'Aftersales workspace'):(zh?'我的售后':'My returns')}"></h1><a th:href="@{${staffView?'/staff/orders':'/orders'}}" th:text="${zh?'返回订单 →':'Orders →'}"></a></div><p th:text="${zh?'申请、审核、退回验收与处理结果，全程可追踪。':'Track requests, review, receipt and resolution.'}"></p><p class="order-card" th:if="${#lists.isEmpty(requests)}" th:text="${zh?'暂无售后申请。请在已完成的订单中发起申请。':'No requests. Start a return from a completed order.'}"></p><article class="order-card return-summary" th:each="r:${requests}"><div><span class="order-badge" th:with="s=${r.status}" th:text="${zh ? (s=='REQUESTED'?'待审核':(s=='APPROVED'?'等待退回':(s=='RECEIVED'?'已验收':(s=='COMPLETED'?'已完成':'已拒绝')))) : s}"></span><h2 th:text="${storeText.text(r.product,zh)}"></h2><p th:text="${r.size+' '+r.color+' × '+r.quantity}"></p><small th:text="${r.customer+' · '+#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></small></div><a th:href="@{${(staffView?'/staff/returns/':'/orders/returns/')+r.id}}" th:text="${zh?'查看申请 →':'View request →'}"></a></article></main></div></th:block><div class="customer-shell" th:unless="${staffView}"><aside th:replace="~{fragments/customer-sidebar :: sidebar('returns')}"></aside><main class="selected-returns">
<h1 th:text="${zh?'退货 / 售后':'Returns & aftersales'}"></h1>
<p class="cart-feedback cart-error" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}" role="alert"></p><p class="cart-feedback" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}" role="status"></p>
<nav class="chosen-status-tabs" data-filter-for="returns" hidden th:aria-label="${zh?'售后状态':'Return status'}"><button type="button" data-status="ALL" aria-pressed="true" th:text="${zh?'全部':'All'}"></button><button type="button" data-status="REQUESTED" aria-pressed="false" th:text="${zh?'待审核':'Requested'}"></button><button type="button" data-status="APPROVED,RECEIVED" aria-pressed="false" th:text="${zh?'处理中':'In progress'}"></button><button type="button" data-status="COMPLETED" aria-pressed="false" th:text="${zh?'已完成':'Completed'}"></button><button type="button" data-status="REJECTED" aria-pressed="false" th:text="${zh?'已拒绝':'Rejected'}"></button></nav>
<p th:if="${#lists.isEmpty(requests)}" th:text="${zh?'暂无售后申请。可在已完成的订单中发起申请。':'No requests. Start a return from a completed order.'}"></p><p data-filter-empty="returns" hidden th:text="${zh?'此状态暂无申请。':'No requests with this status.'}"></p>
<div class="return-master-detail" th:unless="${#lists.isEmpty(requests)}"><div class="return-table-wrap"><table class="return-table"><thead><tr><th th:text="${zh?'申请编号 / 商品':'Request / product'}"></th><th th:text="${zh?'状态':'Status'}"></th><th th:text="${zh?'申请时间':'Date'}"></th><th th:text="${zh?'操作':'Action'}"></th></tr></thead><tbody>
<tr th:each="r:${requests}" data-filter-row="returns" th:attr="data-status=${r.status}"><td><div class="return-product"><img th:if="${returnImages[r.productId]!=null}" th:src="@{${returnImages[r.productId]}}" alt="" width="56" height="70"><div><strong th:text="${storeText.text(r.product,zh)}"></strong><small th:text="${#strings.substring(r.id,0,8)}"></small></div></div></td><td><span class="order-badge" th:with="s=${r.status}" th:text="${zh?(s=='REQUESTED'?'待审核':(s=='APPROVED'?'等待退回':(s=='RECEIVED'?'已验收':(s=='COMPLETED'?'已完成':'已拒绝')))):s}"></span></td><td th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd')}"></td><td><button type="button" data-return-select hidden th:attr="aria-label=${(zh?'预览申请 ':'Preview request ')+#strings.substring(r.id,0,8)}" th:text="${zh?'预览':'Preview'}"></button><a th:href="@{/orders/returns/{id}(id=${r.id})}" th:text="${zh?'详情':'Details'}"></a>
<template data-return-summary><article><h2 th:text="${zh?'申请摘要':'Request summary'}"></h2><img class="return-summary-photo" th:if="${returnImages[r.productId]!=null}" th:src="@{${returnImages[r.productId]}}" alt="" width="150" height="180"><h3 th:text="${storeText.text(r.product,zh)}"></h3><p th:text="${(#strings.isEmpty(r.size) and #strings.isEmpty(r.color)?(zh?'默认款式':'Standard'):(r.size+' '+storeText.text(r.color,zh)))+' × '+r.quantity}"></p><dl><dt th:text="${zh?'申请编号':'Request'}"></dt><dd th:text="${r.id}"></dd><dt th:text="${zh?'申请时间':'Requested'}"></dt><dd th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></dd><dt th:text="${zh?'申请原因':'Reason'}"></dt><dd th:text="${r.reason}"></dd></dl><a class="order-button" th:href="@{/orders/returns/{id}(id=${r.id})}" th:text="${zh?'查看申请详情':'View request'}"></a></article></template></td></tr></tbody></table></div><aside class="return-preview" data-return-preview hidden aria-live="polite"></aside></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
