<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"><link rel="stylesheet" th:href="@{/css/admin-console.css}"></head><body><header th:replace="~{fragments/layout :: header('orders')}"></header><div th:class="${(isAdmin or supportStaff) and staffView?'admin-shell':null}"><th:block th:if="${staffView}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('returns')} "></aside></th:block><main class="order-page fulfillment-page"><p class="cart-feedback cart-error" role="alert" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}"></p><p class="cart-feedback" role="status" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}"></p><div class="fulfillment-heading"><h1 th:text="${staffView?(zh?'售后工作台':'Aftersales workspace'):(zh?'我的售后':'My returns')}"></h1><a th:href="@{${staffView?'/staff/orders':'/orders'}}" th:text="${zh?'返回订单 →':'Orders →'}"></a></div><p th:text="${zh?'申请、审核、退回验收与处理结果，全程可追踪。':'Track requests, review, receipt and resolution.'}"></p><p class="order-card" th:if="${#lists.isEmpty(requests)}" th:text="${zh?'暂无售后申请。请在已完成的订单中发起申请。':'No requests. Start a return from a completed order.'}"></p><article class="order-card return-summary" th:each="r:${requests}"><div><span class="order-badge" th:with="s=${r.status}" th:text="${zh ? (s=='REQUESTED'?'待审核':(s=='APPROVED'?'等待退回':(s=='RECEIVED'?'已验收':(s=='COMPLETED'?'已完成':'已拒绝')))) : s}"></span><h2 th:text="${storeText.text(r.product,zh)}"></h2><p th:text="${r.size+' '+r.color+' × '+r.quantity}"></p><small th:text="${r.customer+' · '+#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></small></div><a th:href="@{${(staffView?'/staff/returns/':'/orders/returns/')+r.id}}" th:text="${zh?'查看申请 →':'View request →'}"></a></article></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
