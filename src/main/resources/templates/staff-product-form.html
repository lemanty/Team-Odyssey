<!DOCTYPE html>
<html lang="en" th:lang="${zh ? 'zh-CN' : 'en'}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${editing ? (zh ? '编辑商品 | Odyssey' : 'Edit product | Odyssey') : (zh ? '新增商品 | Odyssey' : 'New product | Odyssey')}">Product | Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css(v=staff-1)}"></head>
<body><header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="account-page staff-page">
    <div th:replace="~{fragments/auth :: language(${editing ? '/staff/products/' + productId + '/edit' : '/staff/products/new'})}"></div>
    <p class="eyebrow">ODYSSEY TEAM</p>
    <h1 th:text="${editing ? (zh ? '编辑商品' : 'Edit product') : (zh ? '新增商品' : 'New product')}">Product</h1>
    <p class="auth-alert" role="alert" th:if="${validationError}" th:text="${zh ? '请检查表单：名称、分类、描述为必填；价格须为不小于 0 的数字，库存须为不小于 0 的整数。' : 'Check the form: name, category and description are required; price must be a non-negative number and stock a non-negative integer.'}"></p>
    <form class="auth-form staff-form" method="post" th:action="${editing ? '/staff/products/' + productId + '/edit' : '/staff/products/new'}">
        <label for="name" th:text="${zh ? '商品名称' : 'Product name'}"></label>
        <input id="name" name="name" type="text" maxlength="150" required th:value="${form.name}">
        <label for="category" th:text="${zh ? '分类' : 'Category'}"></label>
        <input id="category" name="category" type="text" maxlength="50" required th:value="${form.category}" placeholder="Clothing / Household">
        <label for="description" th:text="${zh ? '描述' : 'Description'}"></label>
        <textarea id="description" name="description" rows="4" required th:text="${form.description}"></textarea>
        <label for="price" th:text="${zh ? '价格（€）' : 'Price (€)'}"></label>
        <input id="price" name="price" type="number" step="0.01" min="0" required th:value="${form.price}">
        <label for="audience" th:text="${zh ? '系列（可选）' : 'Collection (optional)'}"></label>
        <input id="audience" name="audience" type="text" maxlength="20" th:value="${form.audience}">
        <label for="stockQuantity" th:text="${zh ? '库存数量' : 'Stock quantity'}"></label>
        <input id="stockQuantity" name="stockQuantity" type="number" step="1" min="0" required th:value="${form.stockQuantity}">
        <label for="garmentImage" th:text="${zh ? '商品图片路径（可选）' : 'Garment image path (optional)'}"></label>
        <input id="garmentImage" name="garmentImage" type="text" maxlength="255" th:value="${form.garmentImage}" placeholder="/images/products/...">
        <label for="modelImage" th:text="${zh ? '模特图路径（可选）' : 'Model image path (optional)'}"></label>
        <input id="modelImage" name="modelImage" type="text" maxlength="255" th:value="${form.modelImage}" placeholder="/images/products/...">
        <label class="staff-check" for="active">
            <input id="active" name="active" type="checkbox" value="true" th:checked="${form.active}">
            <span th:text="${zh ? '上架（前台可见）' : 'Live (visible in the catalogue)'}"></span>
        </label>
        <button class="cart-button" type="submit" th:text="${editing ? (zh ? '保存修改' : 'Save changes') : (zh ? '创建商品' : 'Create product')}">Save</button>
    </form>
    <a class="detail-back" th:href="@{/staff/products}" th:text="${zh ? '返回商品列表 →' : 'Back to catalogue →'}">Back to catalogue →</a>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
