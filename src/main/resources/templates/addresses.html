<!DOCTYPE html><html lang="en" th:lang="${zh?'zh-CN':'en'}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'收货地址 | Odyssey':'Addresses | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css(v=options-2)}"></head><body><header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="order-page address-page"><a class="detail-back" th:href="@{/account}" th:text="${zh?'← 我的账号':'← My account'}"></a><h1 th:text="${zh?'收货地址':'Your addresses'}"></h1><p th:text="${zh?'保存常用地址，结算时轻松选择。最多20个地址。':'Keep your delivery details ready for checkout. Save up to 20 addresses.'}"></p>
<p role="status" th:if="${addressMessage != null}" th:text="${storeText.text(addressMessage,zh)}"></p><p role="alert" class="cart-error" th:if="${addressError != null}" th:text="${storeText.text(addressError,zh)}"></p><p th:unless="${databaseAvailable}" th:text="${zh?'地址管理需要数据库模式。':'Address management requires database mode.'}"></p>
<div class="order-grid address-layout" th:if="${databaseAvailable}"><section class="address-list" aria-labelledby="saved-address-title">
<div class="address-list-heading"><h2 id="saved-address-title" th:text="${zh?'已保存的地址':'Saved addresses'}"></h2><span th:text="${#lists.size(addresses)} + ' / 20'"></span></div>
<p class="address-empty" th:if="${#lists.isEmpty(addresses)}" th:text="${zh?'还没有保存地址。添加常用地址，让下次结算更轻松。':'Save your first address for an easier checkout next time.'}"></p>
<article class="address-card" th:each="a:${addresses}" th:classappend="${a.isDefault?'is-default':''}">
    <div class="address-card-heading">
        <div class="address-recipient"><span class="address-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><h3 th:text="${a.recipient}"></h3><p class="address-phone" th:text="${a.phone}"></p></div></div>
        <span class="address-default-badge" th:if="${a.isDefault}" th:text="${zh?'默认地址':'Default'}"></span>
    </div>
    <div class="address-destination"><span class="address-caption" th:text="${zh?'收货地址':'Delivery address'}"></span><p class="address-text" th:text="${a.addressLine}"></p></div>
    <div class="address-actions">
        <a class="address-action" th:href="@{/account/addresses(edit=${a.id})}" th:text="${zh?'编辑地址':'Edit address'}"></a>
        <form th:unless="${a.isDefault}" method="post" th:action="@{/account/addresses/{id}/default(id=${a.id})}"><button class="address-action" th:text="${zh?'设为默认':'Set as default'}"></button></form>
        <form class="address-delete" method="post" th:action="@{/account/addresses/{id}/delete(id=${a.id})}"><button class="address-action" th:text="${zh?'删除':'Delete'}"></button></form>
    </div>
</article>
</section>
<form class="order-card order-form address-editor" method="post" th:action="@{/account/addresses}"><h2 th:text="${editing!=null and editing.id>0 ? (zh?'编辑地址':'Edit address') : (zh?'添加地址':'Add address')}"></h2><input th:if="${editing!=null and editing.id>0}" type="hidden" name="id" th:value="${editing.id}"><label for="recipient" th:text="${zh?'收件人':'Recipient'}"></label><input id="recipient" name="recipient" autocomplete="name" maxlength="80" required th:value="${editing?.recipient}"><label for="phone" th:text="${zh?'联系电话':'Phone'}"></label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required th:value="${editing?.phone}"><label for="addressLine" th:text="${zh?'完整地址（国家、城市、街道、门牌号及邮编）':'Full address (country, city, street, unit and postal code)'}"></label><textarea id="addressLine" name="addressLine" autocomplete="street-address" maxlength="350" required rows="4" th:text="${editing?.addressLine}"></textarea><label class="address-default"><input type="checkbox" name="makeDefault" value="true" th:checked="${editing!=null and editing.isDefault}"><span th:text="${zh?'设为默认收货地址':'Use as default delivery address'}"></span></label><button class="order-button" th:text="${zh?'保存地址':'Save address'}"></button><a th:if="${editing!=null}" th:href="@{/account/addresses}" th:text="${zh?'取消编辑':'Cancel editing'}"></a></form></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
