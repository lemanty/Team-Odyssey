<!DOCTYPE html><html lang="en" th:lang="${zh?'zh-CN':'en'}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'收货地址 | Odyssey':'Addresses | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css(v=options-1)}"></head><body><header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="order-page"><a class="detail-back" th:href="@{/account}" th:text="${zh?'← 我的账号':'← My account'}"></a><h1 th:text="${zh?'收货地址':'Your addresses'}"></h1><p th:text="${zh?'保存常用地址，结算时轻松选择。最多20个地址。':'Keep your delivery details ready for checkout. Save up to 20 addresses.'}"></p>
<p role="status" th:if="${addressMessage != null}" th:text="${storeText.text(addressMessage,zh)}"></p><p role="alert" class="cart-error" th:if="${addressError != null}" th:text="${storeText.text(addressError,zh)}"></p><p th:unless="${databaseAvailable}" th:text="${zh?'地址管理需要数据库模式。':'Address management requires database mode.'}"></p>
<div class="order-grid" th:if="${databaseAvailable}"><section><p th:if="${#lists.isEmpty(addresses)}" th:text="${zh?'还没有保存地址，在右侧添加第一个地址吧。':'No saved addresses yet. Add your first address.'}"></p><article class="order-card address-card" th:each="a:${addresses}"><span class="support-state" th:if="${a.isDefault}" th:text="${zh?'默认地址':'Default'}"></span><h2 th:text="${a.recipient}"></h2><p th:text="${a.phone}"></p><p class="address-text" th:text="${a.addressLine}"></p><div class="address-actions"><a th:href="@{/account/addresses(edit=${a.id})}" th:text="${zh?'编辑':'Edit'}"></a><form th:unless="${a.isDefault}" method="post" th:action="@{/account/addresses/{id}/default(id=${a.id})}"><button class="text-button" th:text="${zh?'设为默认':'Set as default'}"></button></form><form method="post" th:action="@{/account/addresses/{id}/delete(id=${a.id})}"><button class="text-button" th:text="${zh?'删除':'Delete'}"></button></form></div></article></section>
<form class="order-card order-form" method="post" th:action="@{/account/addresses}"><h2 th:text="${editing!=null and editing.id>0 ? (zh?'编辑地址':'Edit address') : (zh?'添加地址':'Add address')}"></h2><input th:if="${editing!=null and editing.id>0}" type="hidden" name="id" th:value="${editing.id}"><label for="recipient" th:text="${zh?'收件人':'Recipient'}"></label><input id="recipient" name="recipient" autocomplete="name" maxlength="80" required th:value="${editing?.recipient}"><label for="phone" th:text="${zh?'联系电话':'Phone'}"></label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required th:value="${editing?.phone}"><label for="addressLine" th:text="${zh?'完整地址（国家、城市、街道、门牌号及邮编）':'Full address (country, city, street, unit and postal code)'}"></label><textarea id="addressLine" name="addressLine" autocomplete="street-address" maxlength="350" required rows="4" th:text="${editing?.addressLine}"></textarea><label class="address-default"><input type="checkbox" name="makeDefault" value="true" th:checked="${editing!=null and editing.isDefault}"><span th:text="${zh?'设为默认收货地址':'Use as default delivery address'}"></span></label><button class="order-button" th:text="${zh?'保存地址':'Save address'}"></button><a th:if="${editing!=null}" th:href="@{/account/addresses}" th:text="${zh?'取消编辑':'Cancel editing'}"></a></form></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
