<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}">
<head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'编辑商品 | Odyssey':'Edit product | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/product-management.css}"><script defer th:src="@{/js/product-management.js}"></script></head>
<body><header th:replace="~{fragments/layout :: header('account')}"></header><main class="inventory-page">
<a class="detail-back" th:href="@{/staff/products}" th:text="${zh?'← 商品与库存':'← Products & inventory'}"></a><div class="inventory-heading"><div><p class="eyebrow">ODYSSEY / EDITOR</p><h1 th:text="${form.id==null?(zh?'新增商品':'New product'):(zh?'编辑商品':'Edit product')}"></h1><p th:text="${zh?'保存后同步到顾客商品页。已有订单保留购买时的价格和规格。':'Changes update the catalogue. Existing orders retain their purchase price and options.'}"></p></div><a th:if="${form.id!=null and form.published}" th:href="@{/products/{id}(id=${form.id})}" th:text="${zh?'查看商品 →':'View product →'}"></a></div>
<p class="auth-notice" role="status" th:if="${success}" th:text="${storeText.text(success,zh)}"></p><p class="inventory-error" role="alert" th:if="${error}" th:text="${storeText.text(error,zh)}"></p>
<p th:unless="${available}" th:text="${zh?'商品管理需要数据库模式。':'Product management requires database mode.'}"></p>
<form th:if="${available}" method="post" enctype="multipart/form-data" th:action="@{/staff/products/save(_csrf=${_csrf.token})}" th:object="${form}" class="inventory-editor">
<input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{revision}">
<section class="inventory-panel"><h2 th:text="${zh?'01 / 商品信息':'01 / Product details'}"></h2><div class="inventory-grid">
<label><span th:text="${zh?'英文名称':'English name'}"></span><input th:field="*{name}" maxlength="150" required></label>
<label><span th:text="${zh?'中文名称':'Chinese name'}"></span><input th:field="*{nameZh}" maxlength="150" required></label>
<label><span th:text="${zh?'英文描述':'English description'}"></span><textarea rows="5" th:field="*{description}" maxlength="10000" required></textarea></label>
<label><span th:text="${zh?'中文描述':'Chinese description'}"></span><textarea rows="5" th:field="*{descriptionZh}" maxlength="10000" required></textarea></label>
<label><span th:text="${zh?'分类':'Category'}"></span><select th:field="*{category}"><option value="Household" th:text="${zh?'家居':'Household'}"></option><option value="Clothing" th:text="${zh?'服装':'Clothing'}"></option></select></label>
<label><span th:text="${zh?'系列':'Collection'}"></span><select th:field="*{audience}"><option value="Home" th:text="${zh?'家居':'Home'}"></option><option value="Men" th:text="${zh?'男款':'Men'}"></option><option value="Women" th:text="${zh?'女款':'Women'}"></option><option value="Unisex" th:text="${zh?'中性':'Unisex'}"></option></select></label>
<label><span th:text="${zh?'售价 (€)':'Price (€)'}"></span><input type="number" th:field="*{price}" min="0" max="99999999.99" step="0.01" required></label>
<label><span th:text="${zh?'低库存阈值（含此数量）':'Low-stock threshold (inclusive)'}"></span><input type="number" th:field="*{threshold}" min="0" max="1000000" required></label></div></section>
<section class="inventory-panel"><h2 th:text="${zh?'02 / 商品图片':'02 / Product images'}"></h2><p th:text="${zh?'PNG / JPEG，每张最多 5 MB。未选择新图片则保留原图。':'PNG / JPEG, up to 5 MB each. Leave uploads empty to keep existing images.'}"></p><div class="inventory-grid">
<div class="inventory-photo"><img class="photo-preview" th:if="${form.image!=null and !form.image.isBlank()}" th:src="${form.image}" alt=""><label><span th:text="${zh?'商品主图':'Main image'}"></span><span class="upload-button" th:text="${zh?'选择图片':'Choose image'}"></span><input class="inventory-file" type="file" name="mainPhoto" accept="image/png,image/jpeg" data-image-upload><small data-file-name></small></label><details><summary th:text="${zh?'使用已有图片路径':'Use an existing image path'}"></summary><input th:field="*{image}" maxlength="255" aria-label="Image path" placeholder="/images/products/..."></details></div><div class="inventory-photo"><img class="photo-preview" th:if="${form.secondImage!=null and !form.secondImage.isBlank()}" th:src="${form.secondImage}" alt=""><label><span th:text="${zh?'第二张图片（可选）':'Second image (optional)'}"></span><span class="upload-button" th:text="${zh?'选择图片':'Choose image'}"></span><input class="inventory-file" type="file" name="extraPhoto" accept="image/png,image/jpeg" data-image-upload><small data-file-name></small></label><details><summary th:text="${zh?'使用已有图片路径':'Use an existing image path'}"></summary><input th:field="*{secondImage}" maxlength="255" aria-label="Image path" placeholder="/images/products/..."></details></div></div></section>
<section class="inventory-panel"><h2 th:text="${zh?'03 / 规格与库存':'03 / Options & stock'}"></h2><p th:text="${zh?'服装必须填写尺码和颜色。已有规格不能删除或改名，不再售卖时库存设为 0。有规格时总库存由各规格自动相加。':'Clothing needs size and colour options. Existing options cannot be removed or renamed; set stock to 0 to stop selling an option. Total stock is calculated from all options.'}"></p>
<label class="base-stock"><span data-stock-label th:text="${!form.options.isEmpty()?(zh?'合计库存（自动计算）':'Total stock (calculated)'):(zh?'无规格商品库存':'Stock for products without options')}"></span><input type="number" th:field="*{stock}" th:readonly="${!form.options.isEmpty()}" min="0" max="1000000" required></label>
<div class="inventory-options"><div class="option-labels"><span th:text="${zh?'尺码 / 规格':'Size / option'}"></span><span th:text="${zh?'颜色':'Colour'}"></span><span th:text="${zh?'库存':'Stock'}"></span><span></span></div>
<div data-options>
<div class="option-row" th:classappend="${o.stock != null and form.threshold != null and o.stock le form.threshold ? 'option-low' : ''}" th:each="o,iter:*{options}"><input type="hidden" th:field="*{options[__${iter.index}__].id}"><input th:field="*{options[__${iter.index}__].size}" th:readonly="${o.id!=null}" maxlength="30" required aria-label="Size / 尺码"><input th:field="*{options[__${iter.index}__].color}" th:readonly="${o.id!=null}" maxlength="60" required aria-label="Colour / 颜色"><input type="number" th:field="*{options[__${iter.index}__].stock}" min="0" max="1000000" required aria-label="Stock / 库存"><button th:if="${o.id==null}" type="button" data-remove-option th:text="${zh?'移除':'Remove'}"></button><span th:if="${o.id!=null}" th:text="${zh?'已有规格':'Existing'}"></span></div>
</div></div><button type="button" class="secondary-button" data-add-option th:text="${zh?'+ 新增规格':'+ Add option'}"></button>
<template id="option-template"><div class="option-row"><input name="options[INDEX].size" maxlength="30" required aria-label="Size / 尺码"><input name="options[INDEX].color" maxlength="60" required aria-label="Colour / 颜色"><input type="number" name="options[INDEX].stock" value="0" min="0" max="1000000" required aria-label="Stock / 库存"><button type="button" data-remove-option th:text="${zh?'移除':'Remove'}"></button></div></template>
</section>
<section class="inventory-panel inventory-publish"><div><h2 th:text="${zh?'04 / 上架状态':'04 / Availability'}"></h2><label class="publish-check"><input type="checkbox" th:field="*{published}"><span th:text="${zh?'上架，允许顾客浏览和购买':'Publish for customers to browse and buy'}"></span></label><p th:text="${zh?'取消勾选并保存即可下架，历史订单不受影响。':'Uncheck and save to unpublish. Existing orders remain available.'}"></p></div><button class="primary-button" type="submit" th:text="${zh?'保存商品':'Save product'}"></button></section>
</form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
