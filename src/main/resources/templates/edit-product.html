<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}">
<head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'编辑商品 | Odyssey':'Edit product | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/product-management.css}"><script defer th:src="@{/js/product-management.js}"></script><link rel="stylesheet" th:href="@{/css/admin-console.css}"></head>
<body><header th:replace="~{fragments/layout :: header('account')}"></header><div th:class="${isAdmin?'admin-shell':null}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('products')} "></aside><main class="inventory-page">
<a class="detail-back" th:href="@{/staff/products}" th:text="${zh?'← 商品与库存':'← Products & inventory'}"></a><div class="inventory-heading"><div><p class="eyebrow">ODYSSEY / EDITOR</p><h1 th:text="${form.id==null?(zh?'新增商品':'New product'):(zh?'编辑商品':'Edit product')}"></h1><p th:text="${zh?'保存后同步到顾客商品页。已有订单保留购买时的价格和规格。':'Changes update the catalogue. Existing orders retain their purchase price and options.'}"></p></div><a th:if="${form.id!=null and form.published}" th:href="@{/products/{id}(id=${form.id})}" th:text="${zh?'查看商品 →':'View product →'}"></a></div>
<p class="auth-notice" role="status" th:if="${success}" th:text="${storeText.text(success,zh)}"></p><p class="inventory-error" role="alert" th:if="${error}" th:text="${storeText.text(error,zh)}"></p>
<p th:unless="${available}" th:text="${zh?'商品管理需要数据库模式。':'Product management requires database mode.'}"></p>
<th:block th:replace="~{fragments/product-editor :: editor('/staff/products/save')}"></th:block></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
