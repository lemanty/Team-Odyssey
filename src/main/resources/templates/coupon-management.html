<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey · Coupons</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"><link rel="stylesheet" th:href="@{/css/coupons.css}"><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=2)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=2)}"><script defer th:src="@{/js/operations-design.js(v=2)}"></script></head><body class="chosen-design ops-design ops-coupon-management"><header th:replace="~{fragments/layout :: header('account')}"></header><div th:class="${isAdmin?'admin-shell':null}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('coupons')} "></aside><main class="fulfillment-page"><p class="eyebrow">ODYSSEY · OFFERS</p><div class="fulfillment-heading"><h1 th:text="${zh?'优惠券与活动管理':'Manage coupons & offers'}"></h1><a th:href="@{${isAdmin?'/admin':'/staff'}}" th:text="${zh?'返回工作台 →':'Workspace →'}"></a></div><p th:text="${zh?'创建满减券或折扣券，可随时停用。已创建的优惠规则保留不改，调整活动请创建新券，历史订单优惠不受影响。':'Create fixed or percentage discounts. Disable offers at any time. Create a new coupon to change terms; historical order pricing remains unchanged.'}"></p><p class="cart-feedback cart-error" th:if="${couponError}" th:text="${storeText.text(couponError,zh)}"></p><p class="cart-feedback" th:if="${couponMessage}" th:text="${storeText.text(couponMessage,zh)}"></p>
<div class="offer-management"><details class="order-card offer-create" th:open="${draft!=null or #lists.isEmpty(coupons)}"><summary th:text="${zh?'＋ 创建优惠活动':'＋ Create an offer'}"></summary><form class="coupon-create" method="post" th:action="@{/staff/coupons}"><label><span th:text="${zh?'券码':'Code'}"></span><input name="code" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_-]{3,40}" placeholder="WELCOME10" th:value="${draft!=null?draft.code:''}"></label><label><span th:text="${zh?'活动名称':'Offer name'}"></span><input name="title" required maxlength="100" th:value="${draft!=null?draft.title:''}"></label><label><span th:text="${zh?'优惠类型':'Discount type'}"></span><select name="kind"><option value="FIXED" th:selected="${draft==null or draft.kind=='FIXED'}" th:text="${zh?'满减券（减免欧元）':'Fixed amount (€ off)'}"></option><option value="PERCENT" th:selected="${draft!=null and draft.kind=='PERCENT'}" th:text="${zh?'折扣券（减免百分比）':'Percentage off'}"></option></select></label><label><span th:text="${zh?'减免数值（折扣填10表示减10%，即九折）':'Discount value (10 means 10% off for percentage)'}"></span><input name="value" type="number" min="0.01" step="0.01" required th:value="${draft!=null?draft.value:''}"></label><label><span th:text="${zh?'最低商品原价合计 (€)':'Minimum original subtotal (€)'}"></span><input name="minimum" type="number" min="0" step="0.01" required th:value="${draft!=null?draft.minimum:'0'}"></label><label><span th:text="${zh?'开始时间':'Starts at'}"></span><input name="starts" type="datetime-local" required th:value="${draft!=null?draft.starts:''}"></label><label><span th:text="${zh?'结束时间（不含此时刻）':'Ends at (exclusive)'}"></span><input name="ends" type="datetime-local" required th:value="${draft!=null?draft.ends:''}"></label><label class="return-check"><input name="stack" type="checkbox" value="true" th:checked="${draft!=null and draft.stack}"><span th:text="${zh?'允许叠加会员优惠':'Allow membership stacking'}"></span></label><p th:text="${(zh?'活动时间以 ':'Offer times use ')+couponTimezone}"></p><button class="btn" th:text="${zh?'创建优惠券':'Create coupon'}"></button></form></details>
<article class="order-card offer-management-card" th:each="c:${coupons}"><button type="button" class="offer-action" data-offer-select hidden th:text="${zh?'查看活动':'View offer'}"></button><div class="coupon-ticket"><div class="coupon-value" th:text="${c.kind=='FIXED'?'−€'+#numbers.formatDecimal(c.value,1,2):c.value+'% OFF'}"></div><div><h2 th:text="${c.title}"></h2><code th:text="${c.code}"></code><p th:text="${(zh?'商品原价合计满 €':'Minimum original subtotal €')+#numbers.formatDecimal(c.minimum,1,2)}"></p><p th:text="${c.stack?(zh?'可叠加会员优惠：先会员折扣，再减券。':'Stackable: membership discount first, then coupon.'):(zh?'不叠加会员优惠：使用此券时仅享优惠券折扣。':'Not stackable: only the coupon discount applies.')}"></p><small th:text="${#temporals.format(c.starts,'yyyy-MM-dd HH:mm')+' → '+#temporals.format(c.ends,'yyyy-MM-dd HH:mm')}"></small></div></div><div class="fulfillment-heading"><span class="order-badge" th:text="${!c.enabled?(zh?'已停用':'Disabled'):(now.isBefore(c.starts)?(zh?'尚未开始':'Upcoming'):(!now.isBefore(c.ends)?(zh?'已过期':'Expired'):(zh?'进行中':'Active')))}"></span><form method="post" th:action="@{/staff/coupons/{id}/status(id=${c.id})}"><input type="hidden" name="enabled" th:value="${!c.enabled}"><button class="btn" th:text="${c.enabled?(zh?'停用':'Disable'):(zh?'启用':'Enable')}"></button></form></div></article><aside class="offer-inspector" data-offer-inspector hidden></aside></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
