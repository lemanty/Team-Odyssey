<!DOCTYPE html>
<html lang="en" th:lang="${zh ? 'zh-CN' : 'en'}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${zh ? '商品管理 | Odyssey' : 'Catalogue | Odyssey'}">Catalogue | Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css(v=staff-1)}"></head>
<body><header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="account-page staff-page">
    <div th:replace="~{fragments/auth :: language('/staff/products')}"></div>
    <p class="eyebrow">ODYSSEY TEAM</p>
    <h1 th:text="${zh ? '商品管理' : 'Catalogue'}">Catalogue</h1>
    <p class="auth-notice" th:text="${zh ? '维护商品信息、库存与上下架状态。下架后商品不会出现在前台目录。' : 'Maintain products, stock and availability. Hidden products leave the public catalogue.'}"></p>
    <div class="staff-heading">
        <span class="section-heading"><h2 th:text="${zh ? '全部商品' : 'All products'}"></h2><span th:text="${#lists.size(products)} + ' items'">0 items</span></span>
        <a class="cart-button staff-add" th:href="@{/staff/products/new}" th:text="${zh ? '+ 新增商品' : '+ New product'}">+ New product</a>
    </div>
    <p class="cart-feedback" role="status" th:if="${catalogMessage}" th:text="${catalogMessage}"></p>
    <p class="auth-notice" th:if="${#lists.isEmpty(products)}" th:text="${zh ? '还没有商品，点击右上角新增。' : 'No products yet. Add one above.'}"></p>
    <div class="staff-table-wrap" th:unless="${#lists.isEmpty(products)}">
        <table class="staff-table">
            <thead><tr><th th:text="${zh ? 'ID' : 'ID'}">ID</th><th th:text="${zh ? '商品' : 'Product'}">Product</th><th th:text="${zh ? '分类' : 'Category'}">Category</th><th th:text="${zh ? '价格' : 'Price'}">Price</th><th th:text="${zh ? '库存' : 'Stock'}">Stock</th><th th:text="${zh ? '状态' : 'Status'}">Status</th><th class="staff-actions" th:text="${zh ? '操作' : 'Actions'}">Actions</th></tr></thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}">1</td>
                    <td class="staff-name" th:text="${p.name}">Product</td>
                    <td th:text="${p.category}">Category</td>
                    <td th:text="'€' + ${#numbers.formatDecimal(p.price, 1, 2)}">€0.00</td>
                    <td th:text="${p.stockQuantity}">0</td>
                    <td><span class="status-badge status-live" th:if="${p.active}" th:text="${zh ? '在售' : 'Live'}">Live</span><span class="status-badge status-hidden" th:unless="${p.active}" th:text="${zh ? '已下架' : 'Hidden'}">Hidden</span></td>
                    <td class="staff-actions">
                        <a th:href="@{/staff/products/{id}/edit(id=${p.id})}" th:text="${zh ? '编辑' : 'Edit'}">Edit</a>
                        <form method="post" th:action="@{/staff/products/{id}/toggle(id=${p.id})}"><button class="text-button" type="submit" th:text="${p.active ? (zh ? '下架' : 'Hide') : (zh ? '上架' : 'Publish')}">Hide</button></form>
                        <form method="post" th:action="@{/staff/products/{id}/delete(id=${p.id})}" onsubmit="return confirm('Delete this product?');"><button class="text-button staff-danger" type="submit" th:text="${zh ? '删除' : 'Delete'}">Delete</button></form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <a class="detail-back" th:href="@{/staff}" th:text="${zh ? '返回工作台 →' : 'Back to workspace →'}">Back to workspace →</a>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
