<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<details th:fragment="panel" class="stock-tools" data-stock-tools th:attr="data-url=@{/staff/inventory}">
<summary th:text="${zh?'商品库存 · 查询与调整':'Product stock · Find & adjust'}"></summary>
<div data-stock-content><p th:text="${zh?'展开后加载商品库存。':'Open to load inventory.'}"></p></div>
</details>
<section th:fragment="content">
<p th:unless="${available}" th:text="${zh?'请启用数据库模式后管理库存。':'Enable database mode to manage stock.'}"></p>
<th:block th:if="${available}">
<form method="get" th:action="@{/staff/inventory}" class="stock-search"><label><span th:text="${zh?'搜索名称或商品编号':'Search name or product ID'}"></span><input type="search" name="q" th:value="${q}"></label><button type="submit" th:text="${zh?'搜索':'Search'}"></button></form>
<form method="get" th:action="@{/staff/inventory}" class="stock-search"><label><span th:text="${zh?'选择商品':'Choose a product'}"></span><select name="productId" required><option value="" th:text="${zh?'请选择商品':'Choose a product'}"></option><option th:each="p:${items}" th:value="${p.id}" th:selected="${stockForm!=null and stockForm.id==p.id}" th:text="${(zh?p.nameZh:p.name)+' · #'+p.id+' · '+p.stock}"></option></select></label><button th:text="${zh?'查看库存':'View stock'}"></button></form>
<p th:if="${items.isEmpty()}" th:text="${zh?'没有找到商品。':'No products found.'}"></p>
<p role="status" th:if="${stockSuccess}" th:text="${zh?'库存已保存。':'Stock saved.'}"></p><p role="alert" th:if="${stockError}" th:text="${storeText.text(stockError,zh)}"></p>
<form th:if="${stockForm!=null}" method="post" th:action="@{/staff/inventory}" class="stock-editor">
<input type="hidden" name="productId" th:value="${stockForm.id}"><input type="hidden" name="revision" th:value="${stockForm.revision}">
<h3 th:text="${zh?stockForm.nameZh:stockForm.name}"></h3><p th:text="${zh?'填写可售库存。有规格的商品按尺码、颜色分别保存，总数自动合计。':'Enter available stock. Products with options are counted by size and colour.'}"></p>
<div class="stock-options"><label th:if="${stockForm.options.isEmpty()}"><span th:text="${zh?'可售库存':'Available stock'}"></span><input type="number" name="quantity" th:value="${stockForm.stock}" min="0" max="1000000" required></label>
<label th:each="o:${stockForm.options}"><span th:text="${storeText.text(o.color,zh)+' / '+o.size}"></span><input type="number" th:name="${'stock_'+o.id}" th:value="${o.stock}" min="0" max="1000000" required></label></div>
<button type="submit" th:text="${zh?'保存库存':'Save stock'}"></button>
</form></th:block></section>
</body></html>
