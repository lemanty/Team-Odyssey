<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="reviews" id="reviews" class="product-reviews" aria-labelledby="reviews-title">
<div class="reviews-heading"><div><p class="eyebrow">COMMUNITY NOTES</p><h2 id="reviews-title" th:text="${zh?'顾客评论':'Customer reviews'}"></h2></div><div class="reviews-summary" th:if="${reviewData.total>0}"><strong th:text="${#numbers.formatDecimal(reviewData.average,1,1)+' / 5'}"></strong><span th:text="${reviewData.total+(zh?' 条评论':' reviews')}"></span></div></div>
<p role="status" th:if="${reviewMessage}" th:text="${storeText.text(reviewMessage,zh)}"></p><p role="alert" th:if="${reviewError}" th:text="${storeText.text(reviewError,zh)}"></p>
<p th:unless="${reviewsAvailable}" th:text="${zh?'评论功能需要数据库模式。':'Reviews require database mode.'}"></p>
<div th:if="${reviewsAvailable}">
<div class="review-toolbar"><button th:if="${signedIn}" type="button" class="review-button" data-review-open="review-new" th:text="${zh?'＋ 写评论':'＋ Write a review'}"></button><a th:unless="${signedIn}" th:href="@{/login}" th:text="${zh?'登录后评论或回复':'Sign in to review or reply'}"></a><span th:text="${zh?'分享体验，也欢迎交流和追评。':'Share experiences and join the conversation.'}"></span></div>
<p class="review-empty" th:if="${reviewData.reviews.isEmpty()}" th:text="${zh?'还没有评论，分享你的第一份感受吧。':'No reviews yet. Share the first impression.'}"></p>
<div th:each="review:${reviewData.reviews}" class="review-thread">
<div th:replace="~{fragments/reviews :: card(${review})}"></div>
<div class="review-replies" th:if="${reviewReplies.containsKey(review.id)}"><div th:each="reply:${reviewReplies.get(review.id)}"><div th:replace="~{fragments/reviews :: card(${reply})}"></div></div></div>

</div>
<nav class="review-pagination" th:if="${reviewPage>0 or reviewData.more}"><a th:if="${reviewPage>0}" th:href="@{/products/{id}(id=${product.id},reviewPage=${reviewPage-1})}+'#reviews'" th:text="${zh?'← 上一页':'← Previous'}"></a><span th:text="${reviewPage+1}"></span><a th:if="${reviewData.more}" th:href="@{/products/{id}(id=${product.id},reviewPage=${reviewPage+1})}+'#reviews'" th:text="${zh?'下一页 →':'Next →'}"></a></nav>
<dialog id="review-new" class="review-dialog" th:if="${signedIn}" aria-labelledby="review-new-title"><div class="review-compose"><button type="button" data-review-close class="review-close" th:aria-label="${zh?'关闭':'Close'}">×</button><h3 id="review-new-title" th:text="${zh?'写下你的评论':'Write a review'}"></h3><form method="post" th:action="@{/products/{id}/reviews(id=${product.id})}"><label for="new-rating" th:text="${zh?'评分':'Rating'}"></label><select id="new-rating" name="rating" required><option value="" th:text="${zh?'请选择评分':'Choose a rating'}"></option><option th:each="star:${#numbers.sequence(5,1,-1)}" th:value="${star}" th:text="${star+(zh?' 星':' stars')}"></option></select>
<label th:unless="${#lists.isEmpty(reviewPurchases)}" for="new-purchase" th:text="${zh?'购买规格':'Purchased option'}"></label><select th:unless="${#lists.isEmpty(reviewPurchases)}" id="new-purchase" name="purchaseKey"><option th:each="p:${reviewPurchases}" th:value="${p.key}" th:text="${(p.size=='' and p.color==''?(zh?'默认款式':'Standard option'):p.size+' / '+storeText.text(p.color,zh))+' · '+#temporals.format(p.date,'yyyy-MM-dd')}"></option></select>
<label for="new-body" th:text="${zh?'评论内容':'Review'}"></label><textarea id="new-body" name="body" required maxlength="2000" rows="6" th:text="${reviewDraft}"></textarea><small th:text="${zh?'最多2000字。购买标记和规格依据本人已完成订单。':'Up to 2000 characters. Verified options come from your completed orders.'}"></small><button class="review-button" th:text="${zh?'发布评论':'Post review'}"></button></form></div></dialog>
</div><script th:src="@{/js/product-reviews.js}" defer></script></section>
<article th:fragment="card(review)" class="review-card" th:id="${'review-'+review.id}" th:classappend="${review.staff and !review.deleted?'review-staff':''}">
<div th:unless="${review.deleted}"><div class="review-card-top"><strong th:text="${review.author==''?(zh?'已注销用户':'Deleted account'):review.author}"></strong><span class="review-staff-badge" th:if="${review.staff}" th:text="${zh?'客服':'Customer service'}"></span><span class="review-stars" th:if="${review.parentId==null}" th:aria-label="${review.rating+'/5'}"><span th:each="star:${#numbers.sequence(1,5)}" th:text="${star<=review.rating?'★':'☆'}" aria-hidden="true"></span></span></div>
<a class="review-reply-target" th:if="${review.parentId!=null and reviewTargets.containsKey(review.parentId)}" th:with="target=${reviewTargets.get(review.parentId)}" th:href="${'#review-'+review.parentId}" th:text="${(zh?'回复 @':'Replying to @')+(target.deleted?(zh?'已删除评论':'Deleted comment'):(target.author==''?(zh?'已注销用户':'Deleted account'):target.author))}"></a>
<div class="review-purchase" th:if="${review.purchased}"><span class="review-verified" th:text="${zh?'✓ 已购买':'✓ Verified purchase'}"></span><span th:text="${review.size=='' and review.color==''?(zh?'默认款式':'Standard option'):review.size+(review.size!='' and review.color!=''?' / ':'')+storeText.text(review.color,zh)}"></span></div><p class="review-body" th:text="${review.body}"></p>
<div class="review-footer"><time th:text="${#temporals.format(review.createdAt,'yyyy-MM-dd HH:mm')}"></time><div class="review-actions" th:if="${review.userId==reviewViewer}"><button type="button" th:attr="data-review-open=${'review-edit-'+review.id}" th:text="${zh?'编辑':'Edit'}"></button><form method="post" th:action="@{/products/{id}/reviews/{review}/delete(id=${product.id},review=${review.id})}"><button class="review-delete" th:text="${zh?'删除':'Delete'}"></button></form></div></div>
<details class="review-reply-form" th:if="${signedIn and !review.deleted}"><summary th:text="${zh?'回复':'Reply'}"></summary><form method="post" th:action="@{/products/{id}/reviews/{review}/reply(id=${product.id},review=${review.id})}"><input type="hidden" name="reviewPage" th:value="${reviewPage}"><label th:for="${'reply-body-'+review.id}" th:text="${zh?'回复内容':'Your reply'}"></label><textarea th:id="${'reply-body-'+review.id}" name="body" required maxlength="2000" rows="3"></textarea><button class="review-button" th:text="${zh?'发布回复':'Post reply'}"></button></form></details>
<dialog th:if="${review.userId==reviewViewer}" th:id="${'review-edit-'+review.id}" class="review-dialog" th:attr="aria-labelledby=${'review-edit-title-'+review.id}"><div class="review-compose"><button type="button" data-review-close class="review-close" th:aria-label="${zh?'关闭':'Close'}">×</button><h3 th:id="${'review-edit-title-'+review.id}" th:text="${zh?'编辑评论':'Edit review'}"></h3><form method="post" th:action="@{/products/{id}/reviews/{review}/edit(id=${product.id},review=${review.id})}"><label th:if="${review.parentId==null}" th:for="${'edit-rating-'+review.id}" th:text="${zh?'评分':'Rating'}"></label><select th:if="${review.parentId==null}" th:id="${'edit-rating-'+review.id}" name="rating"><option th:each="star:${#numbers.sequence(5,1,-1)}" th:value="${star}" th:selected="${star==review.rating}" th:text="${star+(zh?' 星':' stars')}"></option></select><input th:if="${review.parentId!=null}" type="hidden" name="rating" value="1"><label th:for="${'edit-body-'+review.id}" th:text="${zh?'评论内容':'Comment'}"></label><textarea th:id="${'edit-body-'+review.id}" name="body" required maxlength="2000" rows="6" th:text="${review.body}"></textarea><button class="review-button" th:text="${zh?'保存修改':'Save changes'}"></button></form></div></dialog></div>
<p th:if="${review.deleted}" class="review-deleted" th:text="${zh?'该评论已删除':'This comment has been deleted'}"></p>
</article></body></html>
