<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="reviews" id="reviews" class="product-reviews" aria-labelledby="reviews-title">
<div class="reviews-heading"><div><p class="eyebrow">COMMUNITY NOTES</p><h2 id="reviews-title" th:text="${zh?'顾客评论':'Customer reviews'}"></h2></div><div class="reviews-summary" th:if="${reviewData.total>0}"><strong th:text="${#numbers.formatDecimal(reviewData.average,1,1)+' / 5'}"></strong><span th:text="${reviewData.total+(zh?' 条评论':' reviews')}"></span></div></div>
<p class="cart-feedback" role="status" th:if="${reviewMessage}" th:text="${storeText.text(reviewMessage,zh)}"></p>
<p class="cart-error" role="alert" th:if="${reviewError}" th:text="${storeText.text(reviewError,zh)}"></p>
<p th:unless="${reviewsAvailable}" th:text="${zh?'评论功能需要数据库模式。':'Reviews are available in database mode.'}"></p>
<div class="reviews-layout" th:if="${reviewsAvailable}">
<div class="review-list"><p class="review-empty" th:if="${reviewData.total==0}" th:text="${zh?'还没有评论，分享你的第一份感受吧。':'No reviews yet. Share the first impression.'}"></p>
<article class="review-card" th:each="review:${reviewData.reviews}"><div class="review-card-top"><strong th:text="${review.author==''?(zh?'已注销用户':'Deleted account'):review.author}"></strong><span class="review-stars" th:aria-label="${review.rating+(zh?'星，满分5星':' out of 5 stars')}"><span th:each="star:${#numbers.sequence(1,5)}" th:text="${star<=review.rating?'★':'☆'}" aria-hidden="true"></span></span></div>
<div class="review-purchase" th:if="${review.purchased}"><span class="review-verified" th:text="${zh?'✓ 已购买':'✓ Verified purchase'}"></span><span th:text="${review.size=='' and review.color==''?(zh?'默认款式':'Standard option'):review.size+(review.size!='' and review.color!=''?' / ':'')+storeText.text(review.color,zh)}"></span></div>
<p class="review-body" th:text="${review.body}"></p><time th:datetime="${review.createdAt}" th:text="${#temporals.format(review.createdAt,'yyyy-MM-dd HH:mm')}"></time><small th:if="${review.updatedAt.isAfter(review.createdAt)}" th:text="${zh?' · 已编辑':' · Edited'}"></small></article>
<nav class="review-pagination" th:if="${reviewPage>0 or reviewData.more}" th:aria-label="${zh?'评论分页':'Review pages'}"><a th:if="${reviewPage>0}" th:href="@{/products/{id}(id=${product.id},reviewPage=${reviewPage-1})}+'#reviews'" th:text="${zh?'← 上一页':'← Previous'}"></a><span th:text="${(zh?'第 ':'Page ')+(reviewPage+1)+(zh?' 页':'')}"></span><a th:if="${reviewData.more}" th:href="@{/products/{id}(id=${product.id},reviewPage=${reviewPage+1})}+'#reviews'" th:text="${zh?'下一页 →':'Next →'}"></a></nav></div>
<aside class="review-compose"><h3 th:text="${ownReview!=null?(zh?'编辑我的评论':'Edit my review'):(zh?'写下你的评论':'Write a review')}"></h3><p th:unless="${signedIn}" th:text="${zh?'登录后即可分享感受。购买并确认收货后，评论会显示所购规格。':'Sign in to share your thoughts. Completed purchases can display the purchased option.'}"></p><a class="review-button" th:unless="${signedIn}" th:href="@{/login}" th:text="${zh?'登录后评论':'Sign in to review'}"></a>
<form th:if="${signedIn}" method="post" th:action="@{/products/{id}/reviews(id=${product.id})}">
<label for="review-rating" th:text="${zh?'评分':'Rating'}"></label><select id="review-rating" name="rating" required><option value="" th:selected="${reviewRating==null and ownReview==null}" th:text="${zh?'请选择评分':'Choose a rating'}"></option><option th:each="star:${#numbers.sequence(5,1,-1)}" th:value="${star}" th:selected="${reviewRating!=null?reviewRating==star:(ownReview!=null and ownReview.rating==star)}" th:text="${star+(zh?' 星':' stars')}"></option></select>
<div th:unless="${#lists.isEmpty(reviewPurchases)}"><label for="review-purchase" th:text="${zh?'本次评价的购买规格':'Purchased option to review'}"></label><select id="review-purchase" name="purchaseKey"><option th:each="purchase:${reviewPurchases}" th:value="${purchase.key}" th:selected="${reviewPurchase==purchase.key}" th:text="${(purchase.size=='' and purchase.color==''?(zh?'默认款式':'Standard option'):purchase.size+' / '+storeText.text(purchase.color,zh))+' · '+#temporals.format(purchase.date,'yyyy-MM-dd')}"></option></select><small th:text="${zh?'规格来自本人已完成订单，无需手动填写。':'Options come from your completed orders.'}"></small></div>
<p th:if="${#lists.isEmpty(reviewPurchases)}" class="review-hint" th:text="${zh?'暂未找到该商品的已完成订单，此次评论不带“已购买”标记。':'No completed purchase found for this product. This review will not carry a verified-purchase badge.'}"></p>
<label for="review-body" th:text="${zh?'评论内容':'Your review'}"></label><textarea id="review-body" name="body" required maxlength="2000" rows="6" th:placeholder="${zh?'聊聊质感、尺寸或使用感受……':'Share your thoughts on quality, fit or everyday use…'}" th:text="${reviewDraft!=null?reviewDraft:(ownReview!=null?ownReview.body:'')}"></textarea><small th:text="${zh?'最多2000字；每件商品保留一条评论，可随时编辑。':'Up to 2000 characters. One review per product; you can edit it later.'}"></small><button class="review-button" th:text="${ownReview!=null?(zh?'保存修改':'Save changes'):(zh?'发布评论':'Post review')}"></button></form>
<form th:if="${signedIn and ownReview!=null}" method="post" th:action="@{/products/{id}/reviews/delete(id=${product.id})}"><button class="review-delete" th:text="${zh?'删除我的评论':'Delete my review'}"></button></form></aside>
</div></section></body></html>
