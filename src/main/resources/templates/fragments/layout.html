<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(activePage)" class="site-header">
    <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> ODYSSEY<span class="brand-small" th:text="${zh ? '本地好物' : 'LOCAL GOODS'}">LOCAL GOODS</span></a>
    <link rel="stylesheet" th:href="@{/css/navigation.css(v=1)}">
    <script defer th:src="@{/js/navigation.js(v=2)}"></script>
    <script defer th:src="@{/js/account-window.js(v=1)}"></script>
    <nav th:aria-label="${zh ? '主导航' : 'Main navigation'}">
        <a th:href="@{/}" th:attr="aria-current=${activePage == 'home' ? 'page' : null}" th:text="${zh ? '首页' : 'Home'}">Home</a>
        <a th:href="@{/#our-story}" th:text="${zh ? '品牌故事' : 'Our story'}">Our story</a>
        <a th:href="@{/products}" th:attr="aria-current=${activePage == 'products' ? 'page' : null}" th:text="${zh ? '探索商品' : 'Explore products'}"><span th:text="${storeText.text('Explore products', zh)}">Explore products</span></a>
        <a th:href="@{/cart}" th:attr="aria-current=${activePage == 'cart' ? 'page' : null}"><span th:text="${zh ? '购物车' : 'Bag'}">Bag</span> (<span th:text="${cartCount}">0</span>)</a>
        <a th:if="${!signedIn}" th:href="@{/login}" th:attr="aria-current=${#lists.contains({'account', 'orders', 'membership', 'support'}, activePage) ? 'page' : null}" th:text="${zh ? '登录 / 注册' : 'Sign in / Join'}">Sign in / Join</a>
        <a th:if="${signedIn}" th:href="@{/account}" th:attr="aria-current=${#lists.contains({'account', 'orders', 'membership', 'support'}, activePage) ? 'page' : null}" th:text="${zh ? '我的账号' : 'My account'}">My account</a>
        <span class="home-language-switch" role="group" aria-label="Language / 语言">
            <a th:href="${englishLanguageUrl}" lang="en" th:attr="aria-current=${!zh ? 'true' : null}">EN</a>
            <span aria-hidden="true">/</span>
            <a th:href="${chineseLanguageUrl}" lang="zh-CN" th:attr="aria-current=${zh ? 'true' : null}">中文</a>
        </span>
    </nav>
</header>
<footer th:fragment="footer" class="site-footer">
    <span th:text="${zh ? 'ODYSSEY 奥德赛 / 服装与家居好物' : 'ODYSSEY / Clothing &amp; household goods'}">ODYSSEY / Clothing &amp; household goods</span>
    <span th:text="${zh ? '学生项目 · 示例商品目录' : 'Student project · Sample catalogue'}">Student project · Sample catalogue</span>
</footer>
</body>
</html>
