<!DOCTYPE html>
<html lang="en" th:lang="${zh ? 'zh-CN' : 'en'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${zh ? '会员权益 | Odyssey' : 'Membership | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css(v=options-1)}"><link rel="stylesheet" th:href="@{/css/membership.css(v=readable-1)}"><script defer th:src="@{/js/membership.js(v=1)}"></script></head>
<body><header th:replace="~{fragments/layout :: header('membership')}"></header>
<main class="membership-page">
<section class="membership-hero"><div><p class="eyebrow">ODYSSEY CLUB</p><h1 th:text="${zh ? '每一次发现，' : 'More to discover.'}"></h1><h1 class="membership-subtitle" th:text="${zh ? '都有更多回馈。' : 'More to enjoy.'}"></h1><p th:text="${zh ? '从日常好物到家的温度，探索属于你的会员礼遇。' : 'From everyday essentials to comforts for home, discover your membership rewards.'}"></p><a href="#membership-tiers" class="member-link" th:text="${zh ? '探索四档权益 ↓' : 'Explore the four tiers ↓'}"></a></div><div class="membership-pass"><span>ODYSSEY / CLUB</span><span class="pass-ring" aria-hidden="true">◎</span><strong th:text="${zh ? '好物相伴 · 日常有礼' : 'Everyday finds. Lasting rewards.'}"></strong><small th:text="${zh ? '会员权益' : 'Membership benefits'}"></small></div></section>
<p class="membership-notice" th:text="${zh ? '会员优惠已启用。结算时自动核算当前等级，并在订单中保存优惠明细。本项目仍不提供在线支付。' : 'Membership discounts are active. Checkout calculates your tier and saves the discount with your order. Online payment is not provided.'}"></p>
<section th:replace="~{fragments/membership :: level}"></section><p th:unless="${signedIn}"><a th:href="@{/login}" th:text="${zh ? '登录查看我的会员等级 →' : 'Sign in to view your membership →'}"></a></p><section id="membership-tiers" aria-labelledby="tiers-heading"><div class="member-section-title"><h2 id="tiers-heading" th:text="${zh ? '四档会员，逐级解锁' : 'Four tiers of everyday rewards'}"></h2><p th:text="${zh ? '按累计已完成订单的优惠后金额升级，无需单独购买会员。' : 'Upgrade with completed-order totals after discounts, with no membership fee.'}"></p></div><div class="membership-tiers">
<article class="member-tier tier-basic"><span class="tier-number">01 / ODYSSEY</span><h3 th:text="${zh ? '基础会员' : 'Essential'}"></h3><p class="tier-description" th:text="${zh ? '注册即可加入' : 'Join with an account'}"></p><p class="tier-discount" th:text="${zh ? '原价' : 'Regular price'}"></p><p th:text="${zh ? '累计消费满 €0' : 'From €0 completed spend'}"></p><ul><li th:text="${zh ? '服装与家居商品通用' : 'Applies to clothing and household goods'}"></li><li th:text="${zh ? '商品金额按 100% 计算' : 'Pay 100% of the product subtotal'}"></li><li th:text="${zh ? '等级规则见下方说明' : 'See the rules below'}"></li></ul><span class="tier-preview" th:text="${zh ? '结算自动应用' : 'Applied at checkout'}"></span></article><article class="member-tier tier-silver"><span class="tier-number">02 / ODYSSEY</span><h3 th:text="${zh ? '银卡会员' : 'Silver'}"></h3><p class="tier-description" th:text="${zh ? '轻松开启日常礼遇' : 'A little more for your everyday'}"></p><p class="tier-discount" th:text="${zh ? '95折' : '5% off'}"></p><p th:text="${zh ? '累计消费满 €200' : 'From €200 completed spend'}"></p><ul><li th:text="${zh ? '服装与家居商品通用' : 'Applies to clothing and household goods'}"></li><li th:text="${zh ? '商品金额按 95% 计算' : 'Pay 95% of the product subtotal'}"></li><li th:text="${zh ? '等级规则见下方说明' : 'See the rules below'}"></li></ul><span class="tier-preview" th:text="${zh ? '结算自动应用' : 'Applied at checkout'}"></span></article><article class="member-tier tier-gold"><span class="tier-number">03 / ODYSSEY</span><h3 th:text="${zh ? '金卡会员' : 'Gold'}"></h3><p class="tier-description" th:text="${zh ? '让每一次选购更值得' : 'More value in every discovery'}"></p><p class="tier-discount" th:text="${zh ? '9折' : '10% off'}"></p><p th:text="${zh ? '累计消费满 €500' : 'From €500 completed spend'}"></p><ul><li th:text="${zh ? '服装与家居商品通用' : 'Applies to clothing and household goods'}"></li><li th:text="${zh ? '商品金额按 90% 计算' : 'Pay 90% of the product subtotal'}"></li><li th:text="${zh ? '等级规则见下方说明' : 'See the rules below'}"></li></ul><span class="tier-preview" th:text="${zh ? '结算自动应用' : 'Applied at checkout'}"></span></article><article class="member-tier tier-black"><span class="tier-number">04 / ODYSSEY</span><h3 th:text="${zh ? '黑金会员' : 'Signature'}"></h3><p class="tier-description" th:text="${zh ? '为热爱生活的你而设' : 'For a well-loved everyday'}"></p><p class="tier-discount" th:text="${zh ? '85折' : '15% off'}"></p><p th:text="${zh ? '累计消费满 €1,000' : 'From €1,000 completed spend'}"></p><ul><li th:text="${zh ? '服装与家居商品通用' : 'Applies to clothing and household goods'}"></li><li th:text="${zh ? '商品金额按 85% 计算' : 'Pay 85% of the product subtotal'}"></li><li th:text="${zh ? '等级规则见下方说明' : 'See the rules below'}"></li></ul><span class="tier-preview" th:text="${zh ? '结算自动应用' : 'Applied at checkout'}"></span></article></div></section>
<section class="membership-calculator" aria-labelledby="estimate-title"><div><p class="eyebrow" th:text="${zh ? '优惠试算' : 'TRY THE BENEFITS'}"></p><h2 id="estimate-title" th:text="${zh ? '这一单，可以省多少？' : 'What could you save?'}"></h2><p th:text="${zh ? '选择一个等级，看看同样的好物能享受怎样的价格。' : 'Choose a tier to compare the price of the same everyday finds.'}"></p><p class="estimate-note" th:text="${zh ? '此处选择不会变更账号等级，也不会修改购物车价格。' : 'This selection does not change your account tier or cart prices.'}"></p></div><form id="membership-estimator"><label for="member-amount" th:text="${zh ? '商品原价合计 (€)' : 'Product subtotal (€)'}"></label><input id="member-amount" type="number" min="0" max="999999" step="0.01" value="100" required><label for="member-tier" th:text="${zh ? '试算等级' : 'Preview tier'}"></label><select id="member-tier"><option value="100" th:text="${zh ? '基础会员 · 原价' : 'Essential · Regular price'}"></option><option value="95" th:text="${zh ? '银卡会员 · 95折' : 'Silver · 5% off'}"></option><option value="90" selected th:text="${zh ? '金卡会员 · 9折' : 'Gold · 10% off'}"></option><option value="85" th:text="${zh ? '黑金会员 · 85折' : 'Signature · 15% off'}"></option></select><div class="estimate-result" aria-live="polite"><span th:text="${zh ? '预计商品金额' : 'Estimated subtotal'}"></span><output id="member-total">€90.00</output><span><span th:text="${zh ? '预计节省：' : 'Estimated savings: '}"></span><output id="member-saving">€10.00</output></span></div><p id="member-invalid" hidden th:text="${zh ? '请输入0至999999之间的有效金额，最多两位小数。' : 'Enter an amount from 0 to 999999, with up to two decimal places.'}"></p><noscript th:text="${zh ? '开启 JavaScript 可使用实时试算；当前示例为原价 €100 的金卡优惠。' : 'Enable JavaScript for live estimates. The example shown is Gold pricing on €100.'}"></noscript></form></section>
<section class="member-rules"><h2 th:text="${zh ? '权益如何计算' : 'How benefits work'}"></h2>
<details class="soft-disclosure"><summary th:text="${zh ? '如何升级会员？' : 'How would I upgrade?'}"></summary><p th:text="${zh ? '以账号累计已完成订单的优惠后金额作为升级依据。待收货和已取消订单不计入；达到门槛后，下一笔订单自动享受新等级优惠，历史订单保持原金额。' : 'Completed order totals after discounts determine your tier. Pending and cancelled orders do not count. Once you reach a threshold, your next order gets the new discount. Historical orders keep their original totals.'}"></p></details>
<details class="soft-disclosure"><summary th:text="${zh ? '优惠适用于哪些商品？' : 'Which products would qualify?'}"></summary><p th:text="${zh ? '覆盖服装及家居商品。每单使用一个等级折扣，不叠加其他优惠；按订单商品总额计算，四舍五入保留两位小数。' : 'Clothing and household products qualify for one tier discount per order, without stacking. The discounted subtotal is rounded half up to two decimal places.'}"></p></details>
<details class="soft-disclosure"><summary th:text="${zh ? '现在可以享受折扣吗？' : 'Can I use these discounts now?'}"></summary><p th:text="${zh ? '可以。登录后，结算页会展示当前会员优惠、原价与优惠后金额；提交订单时重新核算并保存。无需会员费用，也不会开通付费服务。' : 'Yes. Sign in to see your discount, original subtotal and final total at checkout. Pricing is recalculated and saved when you submit. No membership fees or paid subscriptions apply.'}"></p></details>
</section><div class="member-bottom"><a class="member-link" th:href="@{/products}" th:text="${zh ? '继续探索商品 →' : 'Continue exploring →'}"></a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
