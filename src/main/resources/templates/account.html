<!DOCTYPE html>
<html lang="en" th:lang="${zh ? 'zh-CN' : 'en'}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${zh ? '我的账号 | Odyssey' : 'My account | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css(v=options-1)}"><link rel="stylesheet" th:href="@{/css/account-center.css(v=readable-1)}"></head>
<body><header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="account-center">
<section class="account-welcome"><div><p class="eyebrow">YOUR ODYSSEY</p><h1><span th:text="${zh ? '你好，' : 'Hello, '}"></span><span th:text="${displayName}"></span><span>.</span></h1><p class="account-lead" th:text="${zh ? '订单、礼遇与帮助，都在这里。' : 'Your orders, rewards and a helping hand. All in one place.'}"></p></div><span class="account-role" th:text="${accountRole == 'ADMIN' ? (zh ? '管理员' : 'Administrator') : (accountRole == 'STAFF' ? (zh ? '员工' : 'Staff') : (zh ? '顾客账号' : 'Customer account'))}"></span></section>
<section th:replace="~{fragments/membership :: level}"></section>
<section class="account-destinations" th:aria-label="${zh ? '账号服务' : 'Account services'}">
<a class="account-tile account-tile-orders" th:href="@{/orders}"><span class="account-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2v4m6-4v4M9 11h6m-6 4h4"/></svg></span><h2 th:text="${zh ? '我的订单' : 'My orders'}"></h2><p th:text="${zh ? '查看订单进度，管理配送与收货。' : 'Track your orders, delivery and receipt.'}"></p><span class="account-tile-cta"><span th:text="${zh ? '查看订单' : 'View orders'}"></span><span aria-hidden="true">↗</span></span></a><a class="account-tile account-tile-membership" th:href="@{/membership}"><span class="account-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 5 4 4-7 4 7 5-4-2 12H5Z"/><path d="M6 22h12"/></svg></span><h2 th:text="${zh ? '会员权益' : 'Membership'}"></h2><p th:text="${zh ? '查看当前等级与升级进度，享受专属优惠。' : 'View your tier, upgrade progress and benefits.'}"></p><span class="account-tile-cta"><span th:text="${zh ? '探索权益' : 'Explore benefits'}"></span><span aria-hidden="true">↗</span></span></a><a class="account-tile account-tile-support" th:href="@{${supportStaff ? '/staff/support' : '/support'}}"><span class="account-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3V11a9 9 0 0 1 18 0Z"/><path d="M7 11h10m-10 4h6"/></svg></span><h2 th:text="${supportStaff ? (zh ? '客服工作台' : 'Support inbox') : (zh ? '联系客服' : 'Contact us')}"></h2><p th:text="${supportStaff ? (zh ? '查看顾客对话，处理待回复消息。' : 'Review customer conversations and pending replies.') : (zh ? '关于商品或订单，我们在这里帮你。' : 'Questions about products or orders? We are here to help.')}"></p><span class="account-tile-cta"><span th:text="${zh ? '开始对话' : 'Start a conversation'}"></span><span aria-hidden="true">↗</span></span></a></section>
<section class="account-workspace" th:if="${accountRole == 'STAFF' or accountRole == 'ADMIN'}"><h2 th:text="${zh ? '工作空间' : 'Workspace'}"></h2><div><a th:href="@{/staff}" th:text="${zh ? '员工工作台 →' : 'Staff workspace →'}"></a><a th:if="${accountRole == 'ADMIN'}" th:href="@{/admin}" th:text="${zh ? '管理员工作台 →' : 'Administrator workspace →'}"></a></div></section>
<div class="account-workspace"><h2 th:text="${zh ? '收货地址' : 'Delivery addresses'}"></h2><p th:text="${zh ? '保存常用地址，设置默认地址，结算时直接选择。' : 'Save your addresses and choose a default for faster checkout.'}"></p><a th:href="@{/account/addresses}" th:text="${zh ? '管理收货地址 →' : 'Manage addresses →'}"></a></div>
<section class="account-settings" aria-labelledby="settings-title"><div><p class="eyebrow" th:text="${zh ? '保持联系' : 'STAY CONNECTED'}"></p><h2 id="settings-title" th:text="${zh ? '账号与偏好' : 'Account & preferences'}"></h2></div><div class="account-settings-rows"><div class="account-setting-row"><span th:text="${zh ? '邮箱地址' : 'Email address'}"></span><strong th:text="${accountEmail}"></strong></div><div class="account-setting-row"><span th:text="${zh ? '显示语言' : 'Language'}"></span><div class="account-language" role="group" aria-label="Language / 语言"><a th:href="${chineseLanguageUrl}" th:attr="aria-current=${zh ? 'true' : null}" lang="zh-CN">中文</a><a th:href="${englishLanguageUrl}" th:attr="aria-current=${!zh ? 'true' : null}" lang="en">English</a></div></div><p class="account-setting-note" th:text="${zh ? '语言偏好保存在当前浏览器，180天内有效。' : 'Your language preference is saved in this browser for 180 days.'}"></p><div class="account-setting-row"><div><strong th:text="${zh ? '使用另一个账号' : 'Use another account'}"></strong><p class="account-setting-note" th:text="${zh ? '在独立窗口登录，保留当前账号。' : 'Sign in in a separate window and keep this account open.'}"></p></div><a class="account-window-link" th:href="${newAccountWindowUrl}" target="_blank" rel="noopener" data-new-account-window th:text="${zh ? '新账号窗口 ↗' : 'New account window ↗'}"></a></div></div></section>
<div class="account-bottom"><a th:href="@{/products}" th:text="${zh ? '继续探索商品 →' : 'Continue exploring →'}"></a><form method="post" th:action="@{/logout}"><button type="submit" th:text="${zh ? '退出登录' : 'Sign out'}"></button></form></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
