<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}">
<head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'商品与库存 | Odyssey':'Products & inventory | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/product-management.css}"></head>
<body><header th:replace="~{fragments/layout :: header('account')}"></header><main class="inventory-page">
<a class="detail-back" th:href="@{/account}" th:text="${zh?'← 我的账号':'← My account'}"></a>
<div class="inventory-heading"><div><p class="eyebrow">ODYSSEY / CATALOGUE</p><h1 th:text="${zh?'商品与库存':'Products & inventory'}"></h1><p th:text="${zh?'在一个地方维护商品内容、上架状态与每个规格的库存。':'Manage product content, availability and stock for every option.'}"></p></div><a class="primary-button" th:if="${available}" th:href="@{/staff/products/new}" th:text="${zh?'+ 新增商品':'+ New product'}"></a></div>
<p class="auth-notice" th:unless="${available}" th:text="${zh?'请以数据库模式启动网站后管理商品。':'Start the website in database mode to manage products.'}"></p>
<p class="auth-notice" role="status" th:if="${success}" th:text="${storeText.text(success,zh)}"></p><p class="inventory-error" role="alert" th:if="${error}" th:text="${storeText.text(error,zh)}"></p>
<form th:if="${available}" method="get" th:action="@{/staff/products}" class="inventory-filters"><label><span th:text="${zh?'搜索商品':'Find a product'}"></span><input type="search" name="q" th:value="${q}" th:placeholder="${zh?'名称或商品编号':'Name or product ID'}"></label><label><span th:text="${zh?'显示范围':'Show'}"></span><select name="status"><option value="all" th:selected="${status=='all'}" th:text="${zh?'全部商品':'All products'}"></option><option value="published" th:selected="${status=='published'}" th:text="${zh?'已上架':'Published'}"></option><option value="draft" th:selected="${status=='draft'}" th:text="${zh?'未上架':'Unpublished'}"></option><option value="low" th:selected="${status=='low'}" th:text="${zh?'低库存提醒':'Low stock'}"></option></select></label><button class="primary-button" th:text="${zh?'筛选':'Filter'}"></button><a th:href="@{/staff/products}" th:text="${zh?'清除筛选':'Clear filters'}"></a></form>
<div class="inventory-count" th:if="${available}" th:text="${items.size() + (zh?' 件商品':' products')}"></div>
<div class="inventory-table" th:if="${!items.isEmpty()}"><table><thead><tr><th th:text="${zh?'商品':'Product'}"></th><th th:text="${zh?'价格':'Price'}"></th><th th:text="${zh?'可售库存':'Available stock'}"></th><th th:text="${zh?'状态':'Status'}"></th><th th:text="${zh?'操作':'Actions'}"></th></tr></thead><tbody><tr th:each="p:${items}"><td><div class="inventory-product"><img th:if="${p.image!=null and !p.image.isBlank()}" th:src="${p.image}" alt="" loading="lazy"><div><strong th:text="${zh?p.nameZh:p.name}"></strong><small th:text="${'#'+p.id+' · '+storeText.text(p.category,zh)}"></small></div></div></td><td th:text="${'€'+#numbers.formatDecimal(p.price,1,2)}"></td><td><strong th:text="${p.stock}"></strong><span class="inventory-warning" th:if="${p.lowOptions>0}" th:text="${zh?'需要补货':'Restock needed'}"></span></td><td><span class="inventory-badge" th:classappend="${!p.published?'is-draft':''}" th:text="${p.published?(zh?'已上架':'Published'):(zh?'未上架':'Unpublished')}"></span></td><td><a class="secondary-button" th:href="@{/staff/products/{id}/edit(id=${p.id})}" th:text="${zh?'编辑商品':'Edit product'}"></a></td></tr></tbody></table></div>
<div class="inventory-empty" th:if="${available and items.isEmpty()}" th:text="${zh?'没有符合筛选条件的商品。可以清除筛选或新增商品。':'No matching products. Clear your filters or create a product.'}"></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
