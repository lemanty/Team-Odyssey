<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=full-product-3)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=full-product-3)}"><script defer th:src="@{/js/operations-design.js(v=2)}"></script></head><body class="chosen-design ops-design ops-return-form"><header th:replace="~{fragments/layout :: header('orders')}"></header><main class="order-page fulfillment-page"><p class="cart-feedback cart-error" role="alert" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}"></p><p class="cart-feedback" role="status" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}"></p><a th:href="@{/orders/{id}(id=${order.id})}" th:text="${zh?'← 返回订单':'← Back to order'}"></a><h1 th:text="${zh?'申请退货 / 售后':'Request a return'}"></h1><p th:text="${zh?'选择需要处理的商品。退款按购买时的优惠后实付金额计算。每次申请选择一种规格。':'Choose one purchased item per request. Refunds use the original discounted price.'}"></p><p th:unless="${order.status=='COMPLETED'}" class="order-card" th:text="${zh?'请先确认收货，再提交售后申请。':'Confirm receipt before requesting a return.'}"></p><div class="return-application"><nav class="return-steps" aria-label="Steps"><ol><li>1 · <span th:text="${zh?'选择商品':'Select item'}"></span></li><li>2 · <span th:text="${zh?'填写原因':'Reason'}"></span></li><li>3 · <span th:text="${zh?'上传凭证':'Evidence'}"></span></li><li>4 · <span th:text="${zh?'确认提交':'Confirm'}"></span></li></ol></nav><form th:if="${order.status=='COMPLETED'}" class="order-card return-form" method="post" enctype="multipart/form-data" th:action="@{/orders/{id}/return(id=${order.id},_csrf=${_csrf.token})}"><input type="hidden" name="token" th:value="${token}"><fieldset data-return-step><legend th:text="${zh?'选择商品与数量':'Item and quantity'}"></legend><label><span th:text="${zh?'购买商品 / 规格':'Purchased item / variant'}"></span><select name="itemKey" required><option th:each="i:${items}" th:value="${i.variantId>0?-i.variantId:i.productId}" th:selected="${draftItem!=null and draftItem==(i.variantId>0?-i.variantId:i.productId)}" th:text="${storeText.text(i.productName,zh)+' · '+i.size+' '+i.color+' × '+i.quantity}"></option></select></label><label><span th:text="${zh?'退货数量':'Quantity'}"></span><input type="number" name="quantity" min="1" th:value="${draftQuantity!=null?draftQuantity:1}" required></label></fieldset><fieldset data-return-step><legend th:text="${zh?'填写申请原因':'Reason for return'}"></legend><label><span th:text="${zh?'申请原因':'Reason'}"></span><textarea name="reason" required maxlength="1000" rows="5" th:text="${draftReason}"></textarea></label></fieldset><fieldset data-return-step><legend th:text="${zh?'上传凭证（可选）':'Evidence (optional)'}"></legend><label><span th:text="${zh?'凭证图片（可选，JPG/PNG，最大5MB）':'Evidence image (optional, JPG/PNG, up to 5 MB)'}"></span><input type="file" name="image" accept="image/jpeg,image/png"></label></fieldset><fieldset data-return-step><legend th:text="${zh?'确认申请':'Confirm request'}"></legend><p data-return-confirm></p><button class="btn" th:text="${zh?'提交申请':'Submit request'}"></button></fieldset><div class="return-step-buttons" hidden><button type="button" data-step-back th:text="${zh?'上一步':'Back'}"></button><button type="button" data-step-next th:text="${zh?'下一步':'Next'}"></button></div></form><aside class="return-order-summary"><h2 th:text="${zh?'订单摘要':'Order summary'}"></h2><article th:each="i:${items}" th:with="photo=${returnPreviews.^[productId == #vars.i.productId]}"><img th:if="${photo!=null and photo.image!=null}" th:src="${photo.image}" alt=""><strong th:text="${storeText.text(i.productName,zh)}"></strong><p th:text="${i.size+' '+i.color+' × '+i.quantity}"></p><span th:text="${'€'+i.unitPrice}"></span></article><p th:text="${'€'+order.total}"></p><small th:text="${order.id}"></small></aside></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
