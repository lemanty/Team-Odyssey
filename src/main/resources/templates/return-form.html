<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"></head><body><header th:replace="~{fragments/layout :: header('orders')}"></header><main class="order-page fulfillment-page"><p class="cart-feedback cart-error" role="alert" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}"></p><p class="cart-feedback" role="status" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}"></p><a th:href="@{/orders/{id}(id=${order.id})}" th:text="${zh?'← 返回订单':'← Back to order'}"></a><h1 th:text="${zh?'申请退货 / 售后':'Request a return'}"></h1><p th:text="${zh?'选择需要处理的商品。退款按购买时的优惠后实付金额计算。每次申请选择一种规格。':'Choose one purchased item per request. Refunds use the original discounted price.'}"></p><p th:unless="${order.status=='COMPLETED'}" class="order-card" th:text="${zh?'请先确认收货，再提交售后申请。':'Confirm receipt before requesting a return.'}"></p><form th:if="${order.status=='COMPLETED'}" class="order-card return-form" method="post" enctype="multipart/form-data" th:action="@{/orders/{id}/return(id=${order.id},_csrf=${_csrf.token})}"><input type="hidden" name="token" th:value="${token}"><label><span th:text="${zh?'购买商品 / 规格':'Purchased item / variant'}"></span><select name="itemKey" required><option th:each="i:${items}" th:value="${i.variantId>0?-i.variantId:i.productId}" th:selected="${draftItem!=null and draftItem==(i.variantId>0?-i.variantId:i.productId)}" th:text="${storeText.text(i.productName,zh)+' · '+i.size+' '+i.color+' × '+i.quantity}"></option></select></label><label><span th:text="${zh?'退货数量':'Quantity'}"></span><input type="number" name="quantity" min="1" th:value="${draftQuantity!=null?draftQuantity:1}" required></label><label><span th:text="${zh?'申请原因':'Reason'}"></span><textarea name="reason" required maxlength="1000" rows="5" th:text="${draftReason}"></textarea></label><label><span th:text="${zh?'凭证图片（可选，JPG/PNG，最大5MB）':'Evidence image (optional, JPG/PNG, up to 5 MB)'}"></span><input type="file" name="image" accept="image/jpeg,image/png"></label><button class="btn" th:text="${zh?'提交申请':'Submit request'}"></button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
