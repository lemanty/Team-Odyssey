<!DOCTYPE html><html lang="en" th:lang="${zh?'zh-CN':'en'}" xmlns:th="http://www.thymeleaf.org"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'账号管理 | Odyssey':'Accounts | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css(v=users-1)}"><link rel="stylesheet" th:href="@{/css/admin-users.css(v=2)}"><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=2)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=2)}"><script defer th:src="@{/js/operations-design.js(v=2)}"></script></head><body class="chosen-design ops-design ops-admin-users"><header th:replace="~{fragments/layout :: header('account')}"></header>
<div th:class="${isAdmin?'admin-shell':null}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('users')} "></aside><main class="order-page users-page"><a class="detail-back" th:href="@{/account}" th:text="${zh?'← 我的账号':'← My account'}"></a><p class="eyebrow">ODYSSEY / ADMIN</p><h1 th:text="${zh?'账号与权限':'Accounts & roles'}"></h1><p th:text="${zh?'顾客负责购物；员工负责订单和客服；管理员负责账号、订单与储值，不参与客服。':'Customers shop. Staff handle orders and support. Administrators manage accounts, orders and wallets, without support access.'}"></p>
<p class="cart-feedback" role="status" th:if="${roleMessage!=null}" th:text="${storeText.text(roleMessage,zh)}"></p><p class="cart-error" role="alert" th:if="${roleError!=null}" th:text="${storeText.text(roleError,zh)}"></p><p th:unless="${databaseAvailable}" th:text="${zh?'账号管理需要数据库模式。':'Account management requires database mode.'}"></p>
<form class="users-search" method="get" th:action="@{/admin/users}"><label for="q" th:text="${zh?'搜索姓名或邮箱':'Search name or email'}"></label><div><input id="q" name="q" type="search" maxlength="254" th:value="${q}"><button class="order-button" th:text="${zh?'搜索':'Search'}"></button><a th:href="@{/admin/users}" th:text="${zh?'全部账号':'All accounts'}"></a></div></form>
<div class="account-master"><div class="users-table-wrap"><table class="users-table"><caption th:text="${zh?'注册账号 · 每页最多50个':'Registered accounts · up to 50 per page'}"></caption><thead><tr><th scope="col" th:text="${zh?'账号':'Account'}"></th><th scope="col" th:text="${zh?'注册时间':'Registered'}"></th><th scope="col" th:text="${zh?'当前权限':'Current role'}"></th><th scope="col" th:text="${zh?'修改权限':'Change role'}"></th></tr></thead><tbody><tr th:each="a:${accounts}"><td><button type="button" class="account-select" data-account-select th:text="${zh?'选择账号':'Select account'}" hidden></button><strong th:text="${a.name}"></strong><span class="users-email" th:text="${a.email}"></span></td><td th:text="${#temporals.format(a.created,'yyyy-MM-dd HH:mm')}"></td><td><span class="order-badge" th:text="${a.role=='ADMIN'?(zh?'管理员':'Administrator'):(a.role=='STAFF'?(zh?'员工':'Staff'):(zh?'顾客':'Customer'))}"></span></td><td><span th:if="${a.email==actorEmail}" th:text="${zh?'当前账号，不可修改':'Current account · locked'}"></span><form th:unless="${a.email==actorEmail}" method="post" th:action="@{/admin/users/{id}/role(id=${a.id})}"><input type="hidden" name="expected" th:value="${a.role}"><select name="role" th:aria-label="${(zh?'修改角色：':'Change role for ')+a.email}"><option value="CUSTOMER" th:selected="${a.role=='CUSTOMER'}" th:text="${zh?'顾客':'Customer'}"></option><option value="STAFF" th:selected="${a.role=='STAFF'}" th:text="${zh?'员工（含客服）':'Staff (support access)'}"></option><option value="ADMIN" th:selected="${a.role=='ADMIN'}" th:text="${zh?'管理员（不含客服）':'Administrator (no support)'}"></option></select><button class="order-button" th:text="${zh?'保存':'Save'}"></button></form><form class="users-delete-form" data-confirm-delete method="post" th:action="@{/admin/users/{id}/delete(id=${a.id})}" th:unless="${a.email==actorEmail}" th:attr="data-confirm-message=${(zh?'删除账号后将无法登录，订单与流水仍会保留。确认删除：':'This account will no longer be able to sign in. Order and balance history will be retained. Delete: ')+a.email+'?'}"><input type="hidden" name="expected" th:value="${a.role}"><button class="text-button users-delete-button" th:text="${zh?'删除账号':'Delete account'}"></button></form></td></tr></tbody></table><p th:if="${#lists.isEmpty(accounts)}" th:text="${zh?'没有找到符合条件的账号。':'No matching accounts.'}"></p></div>
<aside class="account-inspector" data-account-inspector hidden></aside></div><nav class="users-pagination" aria-label="Pagination"><a th:if="${page>0}" th:href="@{/admin/users(q=${q},page=${page-1})}" th:text="${zh?'← 上一页':'← Previous'}"></a><span th:text="${zh?'页码 ':'Page '}+${page+1}"></span><a th:if="${hasNext}" th:href="@{/admin/users(q=${q},page=${page+1})}" th:text="${zh?'下一页 →':'Next →'}"></a></nav></main></div><footer th:replace="~{fragments/layout :: footer}"></footer><script defer th:src="@{/js/admin-users.js(v=1)}"></script></body></html>
