<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=full-product-3)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=full-product-3)}"><script defer th:src="@{/js/operations-design.js(v=2)}"></script></head><body class="chosen-design ops-design ops-return-detail"><header th:replace="~{fragments/layout :: header('orders')}"></header><div th:class="${(isAdmin or supportStaff) and staffView?'admin-shell':null}"><th:block th:if="${staffView}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('returns')} "></aside></th:block><main class="order-page fulfillment-page"><p class="cart-feedback cart-error" role="alert" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}"></p><p class="cart-feedback" role="status" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}"></p><a th:href="@{${staffView?'/staff/returns':'/orders/returns'}}" th:text="${zh?'← 返回售后列表':'← All requests'}"></a><div class="fulfillment-heading"><h1 th:text="${zh?'售后详情':'Return details'}"></h1><span class="order-badge" th:with="s=${request.status}" th:text="${zh ? (s=='REQUESTED'?'待审核':(s=='APPROVED'?'等待退回':(s=='RECEIVED'?'已验收':(s=='COMPLETED'?'已完成':'已拒绝')))) : s}"></span></div><p class="order-number" th:text="${request.id}"></p><div class="order-grid"><section class="order-card return-request-info"><img class="return-product-photo" th:if="${returnProduct!=null and returnProduct.garmentImage!=null}" th:src="${returnProduct.garmentImage}" alt=""><h2 th:text="${storeText.text(request.product,zh)}"></h2><p th:text="${request.size+' '+request.color+' × '+request.quantity}"></p><p th:text="${request.customer}"></p><p class="return-reason" th:text="${request.reason}"></p><img class="return-evidence" th:if="${request.image}" th:src="@{${(staffView?'/staff/returns/':'/orders/returns/')+request.id+'/image'}}" th:alt="${zh?'售后凭证':'Return evidence'}"><p><a th:href="@{${(staffView?'/staff/orders/':'/orders/')+request.orderId}}" th:text="${zh?'查看原订单 →':'Original order →'}"></a></p><div th:if="${request.status=='COMPLETED'}"><h3 th:text="${zh?'处理结果':'Resolution'}"></h3><p th:text="${(zh?'退款金额：€':'Refund: €')+request.refund}"></p><p th:text="${request.method=='WALLET'?(zh?'已退回储值余额':'Refunded to wallet'):(request.method=='OFFLINE'?(zh?'员工已确认线下退款':'Staff confirmed offline refund'):(zh?'未退款':'No refund'))}"></p><p th:text="${request.restocked?(zh?'已恢复库存':'Stock restored'):(zh?'未恢复库存':'Stock not restored')}"></p></div><p th:if="${request.status=='APPROVED'}" th:text="${zh?'审核已通过，请联系客服确认退回方式。':'Approved. Contact support to arrange the return.'}"></p><a th:unless="${isAdmin}" th:href="@{${supportStaff?'/staff/support':'/support'}}" th:text="${zh?'联系客服（可关联此申请） →':'Contact support and link this request →'}"></a></section><section class="order-card return-activity"><h2 th:text="${zh?'处理记录':'Activity'}"></h2><ol class="return-timeline"><li th:each="event:${events}"><strong th:with="s=${event.status}" th:text="${zh ? (s=='REQUESTED'?'待审核':(s=='APPROVED'?'等待退回':(s=='RECEIVED'?'已验收':(s=='COMPLETED'?'已完成':'已拒绝')))) : s}"></strong><small th:text="${event.actor+' · '+#temporals.format(event.time,'yyyy-MM-dd HH:mm')}"></small><p class="return-reason" th:text="${event.note}"></p></li></ol>
<form th:if="${staffView and request.status!='COMPLETED' and request.status!='REJECTED'}" class="return-form" method="post" th:action="@{/staff/returns/{id}(id=${request.id})}"><label th:if="${request.status=='REQUESTED'}"><span th:text="${zh?'审核决定':'Review decision'}"></span><select name="next"><option value="APPROVED" th:text="${zh?'同意退回':'Approve return'}"></option><option value="REJECTED" th:text="${zh?'拒绝申请':'Reject'}"></option></select></label><input th:if="${request.status=='APPROVED'}" type="hidden" name="next" value="RECEIVED"><input th:if="${request.status=='RECEIVED'}" type="hidden" name="next" value="COMPLETED"><p th:if="${request.status=='APPROVED'}" th:text="${zh?'收到实物并检查后，记录验收结果。':'After receiving the goods, inspect and record the result.'}"></p><div th:if="${request.status=='RECEIVED'}"><label class="return-check"><input type="checkbox" name="restock" value="true"><span th:text="${zh?'商品符合重新销售要求，恢复库存':'Suitable for resale: restore stock'}"></span></label><label class="return-check"><input type="checkbox" name="refund" value="true"><span th:text="${zh?'按原实付金额退款':'Refund at original paid price'}"></span></label><label class="return-check"><input type="checkbox" name="offlineConfirmed" value="true"><span th:text="${zh?'如为线下付款，确认已实际完成线下退款':'For offline payments, confirm refund was actually completed'}"></span></label></div><label><span th:text="${zh?'处理说明（必填）':'Processing notes (required)'}"></span><textarea name="note" required maxlength="1000" rows="4"></textarea></label><button class="btn" th:text="${request.status=='REQUESTED'?(zh?'保存审核结果':'Save review'):(request.status=='APPROVED'?(zh?'确认已收货验收':'Confirm received and inspected'):(zh?'完成处理':'Complete resolution'))}"></button></form></section></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
