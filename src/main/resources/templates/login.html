<!DOCTYPE html>
<html lang="en" th:lang="${zh ? 'zh-CN' : 'en'}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${zh ? '登录 | Odyssey' : 'Sign in | Odyssey'}">Sign in | Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css(v=auth-2)}"></head>
<body>
<header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="auth-page">
    <aside class="auth-art auth-art-login"><p class="eyebrow"><span th:text="${storeText.text('THE ODYSSEY CONTINUES', zh)}">THE ODYSSEY CONTINUES</span></p><h1 th:text="${zh ? '每次相遇，都是新的旅程。' : 'A familiar place. A new discovery.'}">A familiar place. A new discovery.</h1><p th:text="${zh ? '从日常所需，到意外惊喜。欢迎回到 Odyssey。' : 'From everyday essentials to unexpected favourites. Welcome back to Odyssey.'}"></p></aside>
    <section class="auth-panel" aria-labelledby="auth-title">
        <p class="eyebrow"><span th:text="${storeText.text('WELCOME BACK', zh)}">WELCOME BACK</span></p><h2 id="auth-title" th:text="${zh ? '欢迎回来' : 'Sign in.'}"></h2>
        <p class="auth-intro" th:text="${zh ? '登录账号，继续你的发现之旅。' : 'Your next discovery starts here.'}"></p>
        <p class="auth-alert" role="alert" th:if="${param.error}" th:text="${zh ? '用户名、邮箱或密码不正确，请重试。' : 'The username, email or password is incorrect. Please try again.'}"></p>
        <p class="auth-notice" role="status" th:if="${param.registered}" th:text="${zh ? '注册成功！请使用新账号登录。' : 'Account created. Sign in with your new details.'}"></p>
        <p class="auth-notice" role="status" th:if="${param.logout}" th:text="${zh ? '你已安全退出。' : 'You have signed out.'}"></p>
        <p class="auth-alert" th:unless="${databaseAvailable}" th:text="${zh ? '当前为展示模式。请启动 MySQL 模式以使用账号功能。' : 'Accounts require the MySQL version of the website.'}"></p>
        <form class="auth-form" method="post" th:action="@{/login}">
            <label for="email" th:text="${zh ? '用户名或邮箱' : 'Username or email'}"></label><input id="email" name="email" type="text" autocomplete="username" maxlength="254" required placeholder="Admin / you@example.com">
            <label for="password" th:text="${zh ? '密码' : 'Password'}"></label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="64">
            <button class="cart-button" type="submit" th:disabled="${!databaseAvailable}" th:text="${zh ? '登录' : 'Sign in'}"></button>
        </form>
        <div class="auth-switch"><span th:text="${zh ? '第一次来到这里？' : 'New to Odyssey?'}"></span> <a class="auth-switch-button" th:href="@{/register}" th:text="${zh ? '创建账号' : 'Create an account'}"></a></div>
    </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
