<!DOCTYPE html>
<html lang="en" th:lang="${zh?'zh-CN':'en'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'储值账户 | Odyssey':'Wallet | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css(v=wallet-1)}"><link rel="stylesheet" th:href="@{/css/wallet.css(v=1)}"><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=full-product-3)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=full-product-3)}"><script defer th:src="@{/js/operations-design.js(v=1)}"></script></head>
<body class="chosen-design ops-design ops-wallet"><header th:replace="~{fragments/layout :: header('account')}"></header>
<div th:class="${adminView?'admin-shell':'customer-shell'}"><th:block th:if="${adminView}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('wallet')}"></aside></th:block><th:block th:unless="${adminView}"><aside th:replace="~{fragments/customer-sidebar :: sidebar('wallet')}"></aside></th:block><main class="order-page wallet-page">
<a class="detail-back" th:href="@{/account}" th:text="${zh?'← 我的账号':'← My account'}"></a>
<p class="eyebrow">ODYSSEY / WALLET</p><h1 th:text="${adminView?(zh?'储值管理':'Wallet management'):(zh?'我的储值':'My wallet')}"></h1>
<p class="wallet-intro" th:text="${adminView?(zh?'查找账号，调整余额，每一笔变动都有记录。':'Find an account, adjust its balance and keep a record of every change.'):(zh?'让每一笔储值清晰可见。':'Your balance and every change, in one place.')}"></p>
<p role="status" class="cart-feedback" th:if="${walletMessage!=null}" th:text="${storeText.text(walletMessage,zh)}"></p>
<p role="alert" class="cart-error" th:if="${walletError!=null}" th:text="${storeText.text(walletError,zh)}"></p>
<p th:unless="${databaseAvailable}" th:text="${zh?'储值功能需要数据库模式。':'Wallet requires database mode.'}"></p>
<form class="wallet-search" th:if="${adminView and databaseAvailable}" method="get" th:action="@{/admin/wallet}"><label for="email" th:text="${zh?'用户邮箱':'Account email'}"></label><div><input id="email" name="email" type="email" required maxlength="254" th:value="${searchEmail}" placeholder="you@example.com"><button class="order-button" th:text="${zh?'查找账号':'Find account'}"></button></div></form>
<div th:if="${walletAccount!=null}">
<section class="wallet-balance order-card"><div><span class="eyebrow" th:text="${zh?'账户余额 / EUR':'ACCOUNT BALANCE / EUR'}"></span><p class="wallet-amount" th:text="'€'+${#numbers.formatDecimal(balance,1,2)}"></p><p class="wallet-owner"><strong th:text="${walletAccount.name}"></strong><span th:text="${walletAccount.email}"></span></p></div><span class="wallet-emblem" aria-hidden="true">O</span></section>
<p class="wallet-note" th:text="${zh?'储值由管理员确认入账，可在结账时支付订单；待备货订单取消后退回余额。暂不支持在线充值或提现。':'Funds are credited by an administrator and can pay for orders. Cancelling before preparation refunds the wallet. Online top-ups and withdrawals are not available.'}"></p>
<form class="order-card order-form wallet-adjust" th:if="${adminView}" method="post" th:action="@{/admin/wallet/adjust}">
<h2 th:text="${zh?'调整余额':'Adjust balance'}"></h2><p th:text="${zh?'请核对上方姓名和邮箱；扣减金额不能超过现有余额。':'Check the name and email above. A debit cannot exceed the current balance.'}"></p>
<input type="hidden" name="email" th:value="${walletAccount.email}"><input type="hidden" name="token" th:value="${adjustToken}">
<div class="wallet-fields"><div><label for="direction" th:text="${zh?'调整方式':'Adjustment'}"></label><select id="direction" name="direction"><option value="CREDIT" th:text="${zh?'增加余额':'Add funds'}"></option><option value="DEBIT" th:text="${zh?'扣减余额':'Deduct funds'}"></option></select></div><div><label for="amount" th:text="${zh?'金额 (€)':'Amount (€)'}"></label><input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" max="999999.99" step="0.01" required placeholder="0.00"></div></div>
<label for="note" th:text="${zh?'调整原因（用户可见）':'Reason (visible to the account holder)'}"></label><textarea id="note" name="note" maxlength="300" rows="2" required th:placeholder="${zh?'例如：已确认的线下储值、余额更正':'For example: confirmed offline top-up or balance correction'}"></textarea>
<button class="order-button" th:text="${zh?'确认调整余额':'Confirm adjustment'}"></button>
</form>
<section class="wallet-history"><div class="wallet-history-heading"><h2 th:text="${zh?'余额明细':'Balance activity'}"></h2><span th:text="${zh?'最近100笔':'Latest 100 entries'}"></span></div><p class="wallet-empty" th:if="${#lists.isEmpty(entries)}" th:text="${zh?'暂无余额变动。入账后，可在这里查看明细。':'No activity yet. Your balance changes will appear here.'}"></p>
<div class="wallet-ledger"><table><thead><tr><th th:text="${zh?'日期':'Date'}"></th><th th:text="${zh?'类型':'Type'}"></th><th th:text="${zh?'说明':'Description'}"></th><th th:text="${zh?'金额':'Amount'}"></th><th th:text="${zh?'余额':'Balance'}"></th></tr></thead><tbody><tr th:each="entry:${entries}"><td th:text="${#temporals.format(entry.time,'yyyy-MM-dd HH:mm')}"></td><td th:text="${entry.kind=='PAYMENT'?(zh?'订单支付':'Order payment'):(entry.kind=='REFUND'?(zh?'退款':'Refund'):(entry.amount.signum()>0?(zh?'余额入账':'Credit'):(zh?'余额扣减':'Debit')))}"></td><td><span th:text="${entry.kind=='ADJUSTMENT'?entry.note:storeText.text(entry.note,zh)}"></span><a th:if="${entry.orderId!=null}" th:href="@{${adminView?'/staff/orders/'+entry.orderId:'/orders/'+entry.orderId}}" th:text="${'#'+#strings.substring(entry.orderId,0,8)}"></a><small th:text="${(zh?'操作人：':'By: ')+entry.actor}"></small></td><td th:class="${entry.amount.signum()>0?'wallet-credit':'wallet-debit'}" th:text="${(entry.amount.signum()>0?'+€':'−€')+#numbers.formatDecimal(entry.amount.abs(),1,2)}"></td><td th:text="${'€'+#numbers.formatDecimal(entry.balance,1,2)}"></td></tr></tbody></table></div>
</section></div></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
