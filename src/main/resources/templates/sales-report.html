<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head><th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'销售报表 | Odyssey':'Sales report | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/stock-tools.css}"><script defer th:src="@{/js/stock-tools.js(v=always-open-1)}"></script><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=full-product-3)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=full-product-3)}"><script defer th:src="@{/js/operations-design.js(v=1)}"></script><link rel="stylesheet" th:href="@{/css/sales-report.css}"></head><body class="chosen-design ops-design ops-workspace"><header th:replace="~{fragments/layout :: header('account')}"></header><div class="admin-shell"><aside th:replace="~{fragments/workspace-sidebar :: sidebar('sales-report')} "></aside><main class="sales-report">
<h1 th:text="${zh?'商品销售报表':'Product sales report'}"></h1>
<p th:text="${zh?'按下单日期统计当前已完成的订单，退款含这些订单截至查询时已完成的售后。':'Includes orders placed in the selected period that are now complete, and their completed returns to date.'}"></p>
<form method="get" th:action="@{/staff/reports/sales}">
<label><span th:text="${zh?'开始日期':'From'}"></span> <input type="date" name="start" th:value="${start}" required></label>
<label><span th:text="${zh?'结束日期':'Through'}"></span> <input type="date" name="end" th:value="${end}" required></label>
<button class="btn" th:text="${zh?'查看报表':'View report'}"></button></form>
<p role="alert" th:if="${invalidRange}" th:text="${zh?'开始日期不能晚于结束日期。':'Start must be on or before the end date.'}"></p>
<p th:unless="${available}" th:text="${zh?'请连接订单数据库查看销售数据。':'Connect the order database to view sales.'}"></p>
<section th:if="${report != null}"><div class="sales-totals">
<p><span th:text="${zh?'已完成订单':'Completed orders'}"></span> <strong th:text="${report.orders}"></strong></p>
<p><span th:text="${zh?'售出件数':'Units sold'}"></span> <strong th:text="${report.units}"></strong></p>
<p><span th:text="${zh?'折后订单额':'Discounted order total'}"></span> <strong th:text="${'€'+#numbers.formatDecimal(report.sales,1,2)}"></strong></p>
<p><span th:text="${zh?'已退款':'Refunds'}"></span> <strong th:text="${'€'+#numbers.formatDecimal(report.refunds,1,2)}"></strong></p>
<p><span th:text="${zh?'退款后净额':'Order total after refunds'}"></span> <strong th:text="${'€'+#numbers.formatDecimal(report.net(),1,2)}"></strong></p>
</div><p th:if="${report.products.isEmpty()}" th:text="${zh?'所选期间暂无已完成订单。':'No completed orders for this period.'}"></p>
<div style="overflow-x:auto" th:unless="${report.products.isEmpty()}"><table><caption th:text="${zh?'商品销量排行':'Products by units sold'}"></caption><thead><tr><th scope="col" th:text="${zh?'商品':'Product'}"></th><th scope="col" th:text="${zh?'订单数':'Orders'}"></th><th scope="col" th:text="${zh?'销量':'Units'}"></th><th scope="col" th:text="${zh?'折前金额 (€)':'Before discounts (€)'}"></th><th scope="col" th:text="${zh?'已退件数':'Returned units'}"></th><th scope="col" th:text="${zh?'已退款 (€)':'Refunds (€)'}"></th></tr></thead><tbody><tr th:each="p:${report.products}"><td th:text="${p.name}"></td><td th:text="${p.orders}"></td><td th:text="${p.units}"></td><td th:text="${p.gross}"></td><td th:text="${p.returned}"></td><td th:text="${p.refunds}"></td></tr></tbody></table></div></section></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
