<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odyssey</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/fulfillment.css}"></head><body><header th:replace="~{fragments/layout :: header('orders')}"></header><main class="order-page fulfillment-page"><p class="cart-feedback cart-error" role="alert" th:if="${orderError}" th:text="${storeText.text(orderError,zh)}"></p><p class="cart-feedback" role="status" th:if="${orderMessage}" th:text="${storeText.text(orderMessage,zh)}"></p><p class="eyebrow">ORDER WORKSPACE</p><div class="fulfillment-heading"><h1 th:text="${zh?'员工订单工作台':'Order workspace'}"></h1><a th:href="@{/staff/returns}" th:text="${zh?'售后工作台 ↗':'Aftersales ↗'}"></a></div><p th:text="${zh?'优先处理待备货、备货中和待自提订单；同类待处理订单按时间先后排列。':'Actionable orders come first, oldest first within each active status.'}"></p>
<form class="fulfillment-filters" method="get" th:action="@{/staff/orders}"><input type="hidden" name="status" th:value="${status}"><label><span th:text="${zh?'订单号 / 顾客':'Order / customer'}"></span><input type="search" name="q" th:value="${q}" th:placeholder="${zh?'搜索订单号、姓名或邮箱':'Order number, name or email'}"></label><label><span th:text="${zh?'开始日期':'From'}"></span><input type="date" name="from" th:value="${from}"></label><label><span th:text="${zh?'结束日期':'To'}"></span><input type="date" name="to" th:value="${to}"></label><button class="btn" th:text="${zh?'搜索':'Search'}"></button><a th:href="@{/staff/orders}" th:text="${zh?'清除筛选':'Reset'}"></a></form>
<nav class="fulfillment-tabs" aria-label="Order status"><a th:each="entry:${result.counts}" th:with="s=${entry.key}" th:classappend="${status==s?'selected':''}" th:href="@{/staff/orders(status=${s},q=${q},from=${from},to=${to})}"><span th:text="${zh ? (s=='ALL'?'全部':(s=='PENDING'?'待备货':(s=='PREPARING'?'备货中':(s=='SHIPPED'?'配送中':(s=='READY'?'待自提':(s=='COMPLETED'?'已完成':'已取消')))))) : s}"></span><strong th:text="${entry.value}"></strong></a></nav>
<p th:if="${#lists.isEmpty(result.rows)}" class="order-card" th:text="${zh?'没有符合条件的订单。':'No matching orders.'}"></p><div class="fulfillment-table"><table th:unless="${#lists.isEmpty(result.rows)}"><thead><tr><th th:text="${zh?'订单 / 时间':'Order / date'}"></th><th th:text="${zh?'顾客':'Customer'}"></th><th th:text="${zh?'状态':'Status'}"></th><th th:text="${zh?'金额':'Total'}"></th><th></th></tr></thead><tbody><tr th:each="o:${result.rows}"><td><strong th:text="${'#'+#strings.substring(o.id,0,8)}"></strong><small th:text="${#temporals.format(o.date,'yyyy-MM-dd HH:mm')}"></small></td><td><span th:text="${o.customer}"></span><small th:text="${o.email}"></small></td><td><span class="order-badge" th:with="s=${o.status}" th:text="${zh ? (s=='ALL'?'全部':(s=='PENDING'?'待备货':(s=='PREPARING'?'备货中':(s=='SHIPPED'?'配送中':(s=='READY'?'待自提':(s=='COMPLETED'?'已完成':'已取消')))))) : s}"></span><small th:text="${o.fulfillment=='DELIVERY'?(zh?'配送':'Delivery'):(zh?'自提':'Collection')}"></small></td><td th:text="${'€'+o.total}"></td><td><a th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${zh?'查看 / 处理 →':'Open →'}"></a></td></tr></tbody></table></div><nav class="fulfillment-heading"><a th:if="${page>0}" th:href="@{/staff/orders(page=${page-1},status=${status},q=${q},from=${from},to=${to})}" th:text="${zh?'上一页':'Previous'}"></a><span th:text="${(zh?'页码 ':'Page ')+(page+1)}"></span><a th:if="${result.more}" th:href="@{/staff/orders(page=${page+1},status=${status},q=${q},from=${from},to=${to})}" th:text="${zh?'下一页':'Next'}"></a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
