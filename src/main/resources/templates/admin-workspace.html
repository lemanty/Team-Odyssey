<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head><th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'管理员工作台 | Odyssey':'Admin | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/product-management.css}"><link rel="stylesheet" th:href="@{/css/stock-tools.css}"><script defer th:src="@{/js/stock-tools.js(v=always-open-1)}"></script><script defer th:src="@{/js/product-management.js}"></script><link rel="stylesheet" th:href="@{/css/admin-console.css}"><link rel="stylesheet" th:href="@{/css/selected-design.css(v=2)}"><link rel="stylesheet" th:href="@{/css/operations-design.css(v=2)}"><script defer th:src="@{/js/operations-design.js(v=2)}"></script></head><body class="chosen-design ops-design ops-admin-workspace"><header th:replace="~{fragments/layout :: header('account')}"></header><div th:class="${isAdmin?'admin-shell':null}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar(${adminSection})} "></aside><main>
<th:block th:unless="${adminSection=='overview'}"><p class="eyebrow" th:text="${zh?'管理员工作台':'Administrator workspace'}"></p>
<h1 th:text="${adminSection=='new'?(zh?'新增商品':'Add a product'):(zh?'库存调整':'Inventory')}"></h1>
<p th:text="${adminSection=='new'?(zh?'填写商品资料、图片与规格，保存为草稿或直接上架。':'Add details, images and options. Save a draft or publish.'):(zh?'搜索商品，查看可售数量并调整规格库存。':'Find products, review availability and adjust stock.')}"></p>
<th:block th:if="${adminSection=='inventory'}"><section th:replace="~{fragments/stock-tools :: panel}"></section></th:block>
<section th:if="${adminSection=='new'}"><p th:if="${success}" role="status" th:text="${storeText.text(success,zh)}"></p><p th:if="${error}" role="alert" th:text="${storeText.text(error,zh)}"></p><p th:unless="${available}" th:text="${zh?'请启用数据库模式。':'Enable database mode.'}"></p><th:block th:replace="~{fragments/product-editor :: editor('/admin/products/create')}"></th:block></section>
</th:block><section class="admin-overview" th:if="${adminSection=='overview'}"><p class="eyebrow">ODYSSEY / ADMIN</p><h1 th:text="${zh?'管理员工作台':'Administrator workspace'}"></h1><p th:text="${(zh?'欢迎回来，':'Welcome back, ')+navUsername}"></p><div class="overview-metrics" th:if="${available}"><a th:href="@{/staff/products}"><span th:text="${zh?'商品总数':'Products'}"></span><strong th:text="${productCount}"></strong></a><a th:href="@{/staff/products(status=low)}"><span th:text="${zh?'低库存商品':'Low stock'}"></span><strong th:text="${#lists.size(lowStock)}"></strong></a><a th:href="@{/staff/orders}"><span th:text="${zh?'待处理订单':'Actionable orders'}"></span><strong th:text="${pendingCount}"></strong></a><a th:href="@{/staff/returns}"><span th:text="${zh?'售后处理中':'Open returns'}"></span><strong th:text="${returnCount}"></strong></a></div><h2 th:text="${zh?'快捷入口':'Quick access'}"></h2><div class="overview-links"><a th:href="@{/admin(section=new)}" th:text="${zh?'+ 新增商品':'+ Add product'}"></a><a th:href="@{/admin(section=inventory)}" th:text="${zh?'库存管理':'Inventory'}"></a><a th:href="@{/staff/orders}" th:text="${zh?'订单管理':'Orders'}"></a><a th:href="@{/admin/users}" th:text="${zh?'账号管理':'Accounts'}"></a><a th:href="@{/staff/coupons}" th:text="${zh?'优惠券与活动':'Offers'}"></a><a th:href="@{/admin/wallet}" th:text="${zh?'储值管理':'Wallets'}"></a></div><section th:if="${available}"><h2 th:text="${zh?'需要关注的库存':'Inventory to review'}"></h2><p th:if="${#lists.isEmpty(lowStock)}" th:text="${zh?'目前没有低库存提醒。':'No low-stock alerts.'}"></p><a class="overview-stock" th:each="p,iter:${lowStock}" th:if="${iter.index lt 5}" th:href="@{/staff/products/{id}/edit(id=${p.id})}"><img th:src="${p.image}" alt=""><strong th:text="${zh?p.nameZh:p.name}"></strong><span th:text="${(zh?'剩余 ':'Available ')+p.stock}"></span></a></section></section></main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
