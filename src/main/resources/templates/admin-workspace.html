<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${zh?'zh-CN':'en'}"><head><th:block th:replace="~{fragments/site-icons :: icons}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${zh?'管理员工作台 | Odyssey':'Admin | Odyssey'}"></title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/product-management.css}"><link rel="stylesheet" th:href="@{/css/stock-tools.css}"><script defer th:src="@{/js/stock-tools.js(v=always-open-1)}"></script><script defer th:src="@{/js/product-management.js}"></script><link rel="stylesheet" th:href="@{/css/admin-console.css}"></head><body><header th:replace="~{fragments/layout :: header('account')}"></header><div th:class="${isAdmin?'admin-shell':null}"><aside th:replace="~{fragments/workspace-sidebar :: sidebar(${adminSection})} "></aside><main>
<p class="eyebrow" th:text="${zh?'管理员工作台':'Administrator workspace'}"></p>
<h1 th:text="${adminSection=='new'?(zh?'新增商品':'Add a product'):(zh?'库存调整':'Inventory')}"></h1>
<p th:text="${adminSection=='new'?(zh?'填写商品资料、图片与规格，保存为草稿或直接上架。':'Add details, images and options. Save a draft or publish.'):(zh?'搜索商品，查看可售数量并调整规格库存。':'Find products, review availability and adjust stock.')}"></p>
<th:block th:if="${adminSection!='new'}"><section th:replace="~{fragments/stock-tools :: panel}"></section></th:block>
<section th:if="${adminSection=='new'}"><p th:if="${success}" role="status" th:text="${storeText.text(success,zh)}"></p><p th:if="${error}" role="alert" th:text="${storeText.text(error,zh)}"></p><p th:unless="${available}" th:text="${zh?'请启用数据库模式。':'Enable database mode.'}"></p><th:block th:replace="~{fragments/product-editor :: editor('/admin/products/create')}"></th:block></section>
</main></div><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
