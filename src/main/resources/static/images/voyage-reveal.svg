<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="across" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".10" stop-color="white" stop-opacity=".015"/>
      <stop offset=".25" stop-color="white" stop-opacity=".10"/>
      <stop offset=".42" stop-color="white" stop-opacity=".28"/>
      <stop offset=".58" stop-color="white" stop-opacity=".68"/>
      <stop offset=".72" stop-color="white" stop-opacity="1"/>
      <stop offset=".91" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".09" stop-color="white" stop-opacity="1"/>
      <stop offset=".85" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
