  <g mask="url(#soft-ends)">
    <path fill="url(#across)" filter="url(#feather)" d="M 110 0 C 145 120 15 185 44 320 C 78 470 0 525 37 655 C 60 782 113 877 70 1000 L 884 1000 C 979 996 1000 926 991 828 C 978 704 1000 617 993 480 C 984 345 1009 201 981 93 Q 956 0 872 0 Z"/>
