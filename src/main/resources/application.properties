spring.application.name=retail-shop
server.port=${PORT:8080}
spring.thymeleaf.cache=false

spring.profiles.default=demo

# Keep session identifiers out of links; cart belongs to this browser session.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Chat attachments: decoded image size is also checked in SupportImage.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
